name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module -Name Microsoft.Graph.Authentication -MinimumVersion 2.0.0 -Scope CurrentUser -Force

      - name: Lint
        run: ./build/build.ps1 -Task Lint

      - name: Test
        run: ./build/build.ps1 -Task Test

      - name: Build sample report
        run: ./build/build.ps1 -Task Sample

      - name: Check that the check docs are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./build/build.ps1 -Task Docs
          $changes = git status --porcelain -- docs/checks
          if ($changes) { $changes; throw 'docs/checks is out of date: run ./build/build.ps1 -Task Docs and commit the result.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults.xml
          if-no-files-found: ignore

      - name: Upload sample report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sample-report
          path: samples/sample-report.html
          if-no-files-found: ignore
