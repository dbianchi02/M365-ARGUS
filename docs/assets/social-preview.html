<!-- Source of argus-social-preview.png (1280x640, GitHub social preview). Render with a headless browser:
     msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640 --screenshot=argus-social-preview.png social-preview.html --><style>
html,body{margin:0;width:1280px;height:640px;background:#0e0e10;font-family:'Segoe UI',system-ui,sans-serif;color:#fafafa;overflow:hidden}
.wrap{position:absolute;inset:0;padding:0 112px;display:flex;flex-direction:column;justify-content:center}
.grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent 30%,#000 100%)}
.ring{position:absolute;right:-150px;top:50%;transform:translateY(-50%);width:640px;height:640px;border-radius:50%;border:1px solid rgba(255,255,255,.09)}
.ring.r2{width:460px;height:460px;right:-60px;border-color:rgba(255,255,255,.12)}
.ring.r3{width:280px;height:280px;right:30px;border:7px solid rgba(255,255,255,.06);border-top-color:#4ade80;border-right-color:#4ade80;transform:translateY(-50%) rotate(-20deg)}
.score{position:absolute;right:80px;top:50%;transform:translateY(-50%);text-align:center;width:180px}
.score b{display:block;font-size:64px;font-weight:650;letter-spacing:-.02em}
.score span{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#a1a1aa}
h1{margin:44px 0 0;font-size:46px;line-height:1.15;font-weight:600;letter-spacing:-.01em;max-width:700px}
p{margin:22px 0 0;font-size:24px;color:#a1a1aa;max-width:660px;line-height:1.45}
code{display:inline-block;margin-top:40px;font:500 22px 'Cascadia Mono',Consolas,monospace;color:#e4e4e7;background:#18181b;border:1px solid #27272a;border-radius:10px;padding:14px 20px}
code i{color:#71717a;font-style:normal}
</style></head><body>

<img src="argus-logo-dark.svg" width="390">
