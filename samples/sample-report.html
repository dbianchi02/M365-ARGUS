ates. Archiving or deleting them keeps search, storage and access reviews meaningful.","Remediation":{"Steps":"1. Contact the owners of each inactive team and confirm whether it is still needed.\n2. Archive teams whose content must be kept (read-only) and delete the others after your retention period.\n3. Use the group expiration policy (ARG.GRP.003) to automate the review.","PowerShell":"# Sample only - review before running. Archives one team (read-only).\nConnect-MgGraph -Scopes \u0027TeamSettings.ReadWrite.All\u0027\nInvoke-MgArchiveTeam -TeamId \u0027\u003CGroupId\u003E\u0027","PortalUrl":"https://admin.teams.microsoft.com/teams/manage"},"References":[{"Title":"Microsoft Teams team usage report","Url":"https://learn.microsoft.com/en-us/microsoftteams/teams-analytics-and-reports/teams-usage-report"},{"Title":"Archive or restore a team","Url":"https://learn.microsoft.com/en-us/microsoftteams/archive-or-delete-a-team"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All"],"Licenses":[],"DataSets":["TeamsActivity","ReportSettings"],"OptionalDataSets":["Groups"]},"Tags":["Teams","Lifecycle","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.GRP.006","Title":"Teams with guests and no owner","Area":"GroupsTeams","AreaDisplayName":"Groups \u0026 Teams","Category":"Ownership","Severity":"High","Status":"Failed","Summary":"2 of 312 Teams have guest members and no owner.","AffectedCount":2,"EvaluatedCount":312,"ExcludedCount":0,"Findings":[{"DisplayName":"Vendor Onboarding \u003Cx\u003E","Guests":4,"Members":19,"GuestUsers":["ana_fabrikam.example#EXT#@contoso.onmicrosoft.com","li_tailspin.example#EXT#@contoso.onmicrosoft.com","joe_wingtip.example#EXT#@contoso.onmicrosoft.com","eva_adatum.example#EXT#@contoso.onmicrosoft.com"],"Visibility":"Private","GroupId":"51edd29d-8ae6-0597-9f9a-146895152e23"},{"DisplayName":"Project Atlas","Guests":1,"Members":8,"GuestUsers":["pm_northwind.example#EXT#@contoso.onmicrosoft.com"],"Visibility":"Private","GroupId":"9906021d-c689-8ae4-dd30-12f173ec31d3"}],"FindingColumns":["DisplayName","Guests","Members","GuestUsers","Visibility","GroupId"],"SkipReason":null,"ErrorMessage":null,"Duration":1.128,"Parameters":{},"Description":"Teams (Microsoft 365 groups with a team) that have no owner and at least one guest member. Members of the ownerless Teams are read with JSON batching (\u0060GET /groups/\u003Cid\u003E/members/microsoft.graph.user\u0060, first 999 members).","Rationale":"Guests in a team without owners keep access to its chats, files and site, and nobody reviews or removes them. These Teams are the first to fix among ownerless groups (ARG.GRP.004).","Remediation":{"Steps":"1. Assign at least two owners to each team.\n2. Ask the new owners to review the guest members and remove the ones who no longer need access.\n3. Consider access reviews for guests in Teams (Microsoft Entra ID Governance).","PowerShell":"","PortalUrl":"https://admin.teams.microsoft.com/teams/manage"},"References":[{"Title":"Guest access in Microsoft Teams","Url":"https://learn.microsoft.com/en-us/microsoftteams/guest-access"},{"Title":"Manage guest access with access reviews","Url":"https://learn.microsoft.com/en-us/entra/id-governance/manage-guest-access-with-access-reviews"}],"Requires":{"Services":["Graph"],"GraphScopes":["Group.Read.All","GroupMember.Read.All"],"Licenses":[],"DataSets":["Groups"],"OptionalDataSets":[]},"Tags":["Teams","Guests","Ownership"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":2},{"Id":"ARG.SPO.008","Title":"Orphaned SharePoint sites","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Ownership","Severity":"High","Status":"Failed","Summary":"3 of 486 sites have no responsible owner. Sites without a Microsoft 365 group were not evaluated (connect SharePoint with PnP.PowerShell to include them).","AffectedCount":3,"EvaluatedCount":486,"ExcludedCount":0,"Findings":[{"SiteUrl":"https://contoso.sharepoint.com/sites/OldNewsletter","Title":"Old Newsletter","Type":"Group-connected team site","Reason":"Microsoft 365 group has no owner","Owner":"","GroupId":"e2adf576-8b4e-b80d-8152-cea1af2b5ca3"},{"SiteUrl":"https://contoso.sharepoint.com/sites/ProjectAtlas","Title":"Project Atlas","Type":"Team site (Teams)","Reason":"Microsoft 365 group has no owner","Owner":"","GroupId":"9906021d-c689-8ae4-dd30-12f173ec31d3"},{"SiteUrl":"https://contoso.sharepoint.com/sites/VendorOnboarding","Title":"Vendor Onboarding \u003Cx\u003E","Type":"Team site (Teams)","Reason":"Microsoft 365 group has no owner","Owner":"","GroupId":"51edd29d-8ae6-0597-9f9a-146895152e23"}],"FindingColumns":["SiteUrl","Title","Type","Reason","Owner","GroupId"],"SkipReason":null,"ErrorMessage":null,"Duration":0.785,"Parameters":{},"Description":"Group-connected sites whose Microsoft 365 group has no owner (site URL read with JSON batching, \u0060GET /groups/\u003Cid\u003E/sites/root\u0060). When SharePoint is connected through PnP.PowerShell, sites without a Microsoft 365 group (classic team sites, communication sites) are also evaluated: a site is orphaned when its primary site collection administrator (\u0060Owner\u0060 in \u0060Get-PnPTenantSite\u0060) is empty, disabled or no longer exists. Without PnP those sites are not evaluated and the summary says so.","Rationale":"Nobody manages permissions, sharing or content of a site without a responsible owner, and access requests go unanswered. Orphaned sites are also the hardest to clean up later.","Remediation":{"Steps":"1. For group-connected sites, add owners to the Microsoft 365 group (see ARG.GRP.004).\n2. For other sites, set a new primary site collection administrator in the SharePoint admin center (Active sites \u003E Permissions).\n3. Delete or archive sites that are no longer needed.","PowerShell":"# Sample only - review before running. Sets the primary administrator of a site without a group.\nConnect-PnPOnline -Url \u0027https://\u003Ctenant\u003E-admin.sharepoint.com\u0027 -Interactive -ClientId \u0027\u003CClientId\u003E\u0027\nSet-PnPTenantSite -Identity \u0027\u003CSiteUrl\u003E\u0027 -Owners @(\u0027\u003CUserPrincipalName\u003E\u0027)","PortalUrl":"https://admin.microsoft.com/sharepoint?page=siteManagement\u0026modern=true"},"References":[{"Title":"Manage site admins in the SharePoint admin center","Url":"https://learn.microsoft.com/en-us/sharepoint/manage-site-collection-administrators"},{"Title":"Manage ownerless Microsoft 365 groups and teams","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/create-groups/ownerless-groups-teams"}],"Requires":{"Services":["Graph"],"GraphScopes":["Group.Read.All","Sites.Read.All"],"Licenses":[],"DataSets":["Groups"],"OptionalDataSets":["SharePointSites","Users"]},"Tags":["SharePoint","Ownership"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.SPO.009","Title":"Inactive SharePoint sites (more than 180 days)","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Lifecycle","Severity":"Low","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so inactive sites cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":0.321,"Parameters":{"InactiveDays":180,"ExcludedTemplates":["Basic Search Center","Enterprise Search Center","Compliance Policy Center","SharePoint Online Tenant Fundamental Site","App Catalog Site","Tenant Admin Site"]},"Description":"SharePoint sites whose \u0060Last Activity Date\u0060 in the site usage report (\u0060getSharePointSiteUsageDetail\u0060, period D180) is older than **180** days or empty (no activity in the report period). Deleted sites and system sites (\u0060ExcludedTemplates\u0060: search center, compliance policy center, tenant fundamental site, app catalog) are ignored; OneDrive accounts are not part of this report. When the report leaves \u0060Site URL\u0060 empty (a known issue of the usage reports), the URL is read from the \u0060Site Id\u0060 (\u0060GET /sites/\u003Cid\u003E\u0060); the owner falls back to \u0060Owner Display Name\u0060 and is \u0022Not reported\u0022 when the report has none. With concealed report names, or when the report returns no rows, the result is Investigate.","Rationale":"Inactive sites hold content and permissions that nobody curates, use storage and appear in search. Reviewing them regularly keeps the information architecture clean.","Remediation":{"Steps":"1. Contact the site owners and confirm whether each site is still needed.\n2. Archive (Microsoft 365 Archive) or set to read-only the sites whose content must be kept, delete the others after your retention period.\n3. Consider a site lifecycle policy for inactive sites (SharePoint Advanced Management).","PowerShell":"","PortalUrl":"https://admin.microsoft.com/sharepoint?page=siteManagement\u0026modern=true"},"References":[{"Title":"Microsoft 365 reports in the admin center - SharePoint site usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/sharepoint-site-usage-ww"},{"Title":"Manage site lifecycle policies","Url":"https://learn.microsoft.com/en-us/sharepoint/site-lifecycle-management"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All","Sites.Read.All"],"Licenses":[],"DataSets":["SharePointSiteUsage","ReportSettings"],"OptionalDataSets":[]},"Tags":["SharePoint","Lifecycle","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.002","Title":"Tenant external sharing level","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Sharing","Severity":"Medium","Status":"Investigate","Summary":"External sharing allows Anyone links at organisation level (Anyone (links without sign-in)). Confirm this is intended and which sites need it.","AffectedCount":1,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[{"SharingCapability":"externalUserAndGuestSharing","Level":"Anyone (links without sign-in)","DomainRestriction":"none","GuestsCanReshare":true,"GuestMustMatchInvitedAccount":false}],"FindingColumns":["SharingCapability","Level","DomainRestriction","GuestsCanReshare","GuestMustMatchInvitedAccount"],"SkipReason":null,"ErrorMessage":null,"Duration":0.545,"Parameters":{},"Description":"Reads the organisation-level sharing setting for SharePoint and OneDrive (\u0060admin/sharepoint/settings.sharingCapability\u0060). **Anyone** (\u0060externalUserAndGuestSharing\u0060: links that do not require sign-in) is reported as Investigate; New and existing guests, Existing guests only and Only people in your organisation pass. The findings also show the domain restriction mode and whether guests can reshare. Individual sites can only be more restrictive than this setting.","Rationale":"Anyone links can be forwarded to people outside the organisation without any record of who opened them. Many organisations allow them on purpose for a few sites; the tenant-wide level should be a conscious decision with site-level restrictions where needed.","Remediation":{"Steps":"1. Decide which external sharing level the organisation needs.\n2. If Anyone links are required only for some sites, lower the organisation level to New and existing guests and allow Anyone only on those sites, or keep Anyone with link expiration and View-only defaults.\n3. Review the domain allow/block list and guest resharing.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/sharepoint?page=sharing\u0026modern=true"},"References":[{"Title":"Manage sharing settings for SharePoint and OneDrive","Url":"https://learn.microsoft.com/en-us/sharepoint/turn-external-sharing-on-or-off"},{"Title":"sharepointSettings resource type","Url":"https://learn.microsoft.com/en-us/graph/api/resources/sharepointsettings"}],"Requires":{"Services":["Graph"],"GraphScopes":["SharePointTenantSettings.Read.All"],"Licenses":[],"DataSets":["SharePointTenantSettings"],"OptionalDataSets":[]},"Tags":["SharePoint","OneDrive","Sharing"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.SPO.010","Title":"Sites near their storage quota (more than 90%)","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Storage","Severity":"Low","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so sites near their quota cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.256,"Parameters":{"QuotaPercent":90},"Description":"SharePoint sites whose used storage is more than **90%** of the allocated storage, from the site usage report (\u0060Storage Used (Byte)\u0060 / \u0060Storage Allocated (Byte)\u0060, period D180). Deleted sites and sites without an allocation are ignored. With concealed report names, or when the report returns no rows, the result is Investigate. When the report leaves \u0060Site URL\u0060 empty (a known issue of the usage reports), the URL is read from the \u0060Site Id\u0060 (\u0060GET /sites/\u003Cid\u003E\u0060).","Rationale":"A site that reaches its quota becomes read-only for new content, which interrupts work. Planning quota increases or clean-up in advance avoids that.","Remediation":{"Steps":"1. Review large libraries, old versions and the recycle bin of each site.\n2. Clean up or archive content that is no longer needed, or reduce the number of kept versions.\n3. Increase the site storage limit if the content is needed and tenant storage allows it.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/sharepoint?page=siteManagement\u0026modern=true"},"References":[{"Title":"Manage site storage limits","Url":"https://learn.microsoft.com/en-us/sharepoint/manage-site-collection-storage-limits"},{"Title":"Microsoft 365 reports in the admin center - SharePoint site usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/sharepoint-site-usage-ww"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All","Sites.Read.All"],"Licenses":[],"DataSets":["SharePointSiteUsage","ReportSettings"],"OptionalDataSets":[]},"Tags":["SharePoint","Storage","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.012","Title":"OneDrive of deleted or disabled users with content","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Lifecycle","Severity":"Low","Status":"NotRun","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Excluded with -ExcludeId.","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"OneDrive accounts from the OneDrive usage report (\u0060getOneDriveUsageAccountDetail\u0060, period D180) that still hold content (\u0060Storage Used (Byte)\u0060 \u003E 0, not deleted) while their owner is disabled or no longer exists in Microsoft Entra ID. The OneDrive of a deleted user is kept for the retention period set in the SharePoint admin center (30 days by default) and then deleted. With concealed report names, or when the report returns no rows, the result is Investigate. When the report leaves \u0060Site URL\u0060 empty (a known issue of the usage reports; this report has no Site Id), the URL comes from the \u0060mySite\u0060 property of the user, or is derived from the UPN with the OneDrive naming convention when the user no longer exists (\u0060UrlSource\u0060 column).","Rationale":"Files of people who left stay in OneDrives that nobody looks after, with their sharing links still active. Deciding what to keep and transferring it to a manager or a site is part of the leaver process.","Remediation":{"Steps":"1. For each account, ask the manager whether content must be kept.\n2. Transfer the needed files to the manager or to a SharePoint site (the manager gets access automatically when the user is deleted, if configured).\n3. Delete the account or let the OneDrive retention period expire; apply a retention policy first when legal requirements apply.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/sharepoint?page=settings\u0026modern=true"},"References":[{"Title":"OneDrive retention and deletion","Url":"https://learn.microsoft.com/en-us/sharepoint/retention-and-deletion"},{"Title":"Microsoft 365 reports in the admin center - OneDrive usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/onedrive-for-business-usage-ww"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All","User.Read.All","Organization.Read.All"],"Licenses":[],"DataSets":["OneDriveUsage","ReportSettings","Users","Organization"],"OptionalDataSets":[]},"Tags":["OneDrive","Lifecycle","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.001","Title":"SharePoint site creation is restricted","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Site governance","Severity":"Medium","Status":"Investigate","Summary":"Users can create SharePoint sites (isSiteCreationEnabled = true). Confirm this is intended and governed.","AffectedCount":1,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[{"Setting":"isSiteCreationEnabled","Value":"True","CreateCommandsShown":true,"DefaultManagedPath":"sites"}],"FindingColumns":["Setting","Value","CreateCommandsShown","DefaultManagedPath"],"SkipReason":null,"ErrorMessage":null,"Duration":1.792,"Parameters":{},"Description":"Reads \u0060admin/sharepoint/settings.isSiteCreationEnabled\u0060 (\u0022Users can create SharePoint sites\u0022 in the SharePoint admin center) and \u0060isSiteCreationUIEnabled\u0060. When users can create sites, communication sites and team sites without a group can be created by anyone, even if Microsoft 365 group creation is restricted (ARG.GRP.001): Investigate, as it is a valid choice for some organisations.","Rationale":"Self-service sites multiply quickly, often without a clear owner, classification or lifecycle. Restricting creation, or routing it through a request process with a template, keeps the site estate governable and the Copilot index clean.","Remediation":{"Steps":"1. Decide whether site creation is open or goes through a request process.\n2. To restrict it, in the SharePoint admin center go to Settings \u003E Site creation and turn off Users can create SharePoint sites.\n3. Keep ARG.GRP.001 aligned: group-connected sites are governed by the Microsoft 365 group creation policy.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/sharepoint?page=settings\u0026modern=true"},"References":[{"Title":"Manage site creation in SharePoint","Url":"https://learn.microsoft.com/en-us/sharepoint/manage-site-creation"},{"Title":"sharepointSettings resource type","Url":"https://learn.microsoft.com/en-us/graph/api/resources/sharepointsettings"}],"Requires":{"Services":["Graph"],"GraphScopes":["SharePointTenantSettings.Read.All"],"Licenses":[],"DataSets":["SharePointTenantSettings"],"OptionalDataSets":[]},"Tags":["SharePoint","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.SPO.011","Title":"OneDrive retention for deleted users is at least 90 days","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Lifecycle","Severity":"Low","Status":"Failed","Summary":"The OneDrive of a deleted user is kept for 30 days, less than 90.","AffectedCount":1,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[{"Setting":"deletedUserPersonalSiteRetentionPeriodInDays","Days":30,"MinimumDays":90}],"FindingColumns":["Setting","Days","MinimumDays"],"SkipReason":null,"ErrorMessage":null,"Duration":0.586,"Parameters":{"MinRetentionDays":90},"Description":"Reads \u0060admin/sharepoint/settings.deletedUserPersonalSiteRetentionPeriodInDays\u0060: how long the OneDrive of a deleted user is kept before it is deleted (30 days by default, up to 3650). Fails when it is shorter than **90** days.","Rationale":"After a user is deleted, the manager has only this period to find and move business files from the OneDrive. Thirty days is often shorter than the time it takes to notice that something is missing, especially when the leaver process runs late.","Remediation":{"Steps":"1. Agree the retention period with records management (for example 90 or 365 days).\n2. In the SharePoint admin center, go to Settings \u003E OneDrive retention and set Days to retain a deleted user\u0027s OneDrive.\n3. Make sure the leaver process grants the manager access to the OneDrive and that retention policies cover legal requirements.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027SharePointTenantSettings.ReadWrite.All\u0027\nInvoke-MgGraphRequest -Method PATCH -Uri \u0027https://graph.microsoft.com/v1.0/admin/sharepoint/settings\u0027 -Body @{ deletedUserPersonalSiteRetentionPeriodInDays = 365 }","PortalUrl":"https://admin.microsoft.com/sharepoint?page=settings\u0026modern=true"},"References":[{"Title":"Set the OneDrive retention for deleted users","Url":"https://learn.microsoft.com/en-us/sharepoint/set-retention"},{"Title":"OneDrive retention and deletion","Url":"https://learn.microsoft.com/en-us/sharepoint/retention-and-deletion"}],"Requires":{"Services":["Graph"],"GraphScopes":["SharePointTenantSettings.Read.All"],"Licenses":[],"DataSets":["SharePointTenantSettings"],"OptionalDataSets":[]},"Tags":["OneDrive","Lifecycle","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.SPO.005","Title":"Guest access to sites and files expires","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Sharing","Severity":"Medium","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Not connected to SharePoint Online (PnP.PowerShell).","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"Reads \u0060ExternalUserExpirationRequired\u0060 and \u0060ExternalUserExpireInDays\u0060 with PnP.PowerShell (\u0060Get-PnPTenant\u0060): whether guests lose access to sites and files after a number of days unless a site owner renews it. Fails when the policy is off. Passes without evaluation when external sharing is disabled (\u0060sharingCapability\u0060 = disabled). Needs \u0060Connect-Argus -Service SharePoint\u0060; otherwise the check is Skipped.","Rationale":"Guests invited for a project keep access long after it ends. An expiration policy makes site owners confirm, periodically, who still needs access; it complements guest reviews in Entra ID (ARG.ENT.005).","Remediation":{"Steps":"1. In the SharePoint admin center, go to Policies \u003E Sharing \u003E More external sharing settings.\n2. Select Guest access to a site or OneDrive will expire automatically after this many days and enter a value (for example 90).\n3. Tell site owners that they will be asked to extend access for guests who still need it.","PowerShell":"# Sample only - review before running.\nConnect-PnPOnline -Url \u0027https://\u003Ctenant\u003E-admin.sharepoint.com\u0027 -Interactive -ClientId \u0027\u003Capp id\u003E\u0027\nSet-PnPTenant -ExternalUserExpirationRequired $true -ExternalUserExpireInDays 90","PortalUrl":"https://admin.microsoft.com/sharepoint?page=sharing\u0026modern=true"},"References":[{"Title":"Manage guest access expiration for sites and files","Url":"https://learn.microsoft.com/en-us/sharepoint/turn-external-sharing-on-or-off#change-the-organization-level-external-sharing-setting"},{"Title":"Set-SPOTenant: ExternalUserExpirationRequired","Url":"https://learn.microsoft.com/en-us/powershell/module/microsoft.online.sharepoint.powershell/set-spotenant"}],"Requires":{"Services":["Graph","SharePoint"],"GraphScopes":["SharePointTenantSettings.Read.All"],"Licenses":[],"DataSets":["SharePointTenantSettings","SharePointTenant"],"OptionalDataSets":[]},"Tags":["SharePoint","OneDrive","Sharing","Guests"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.004","Title":"Anyone links expire within 30 days","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Sharing","Severity":"Medium","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Not connected to SharePoint Online (PnP.PowerShell).","ErrorMessage":null,"Duration":0.0,"Parameters":{"MaxDays":30},"Description":"When the organisation allows Anyone links (\u0060sharingCapability\u0060 = externalUserAndGuestSharing), reads \u0060RequireAnonymousLinksExpireInDays\u0060 with PnP.PowerShell (\u0060Get-PnPTenant\u0060). Fails when Anyone links never expire (0 or not set) or expire after more than **30** days. Passes without evaluation when Anyone links are not allowed. Needs \u0060Connect-Argus -Service SharePoint\u0060; otherwise the check is Skipped.","Rationale":"An Anyone link works for whoever has it, for as long as it exists. An expiration limit bounds how long a forwarded or leaked link stays usable, without forbidding Anyone links where the business needs them.","Remediation":{"Steps":"1. In the SharePoint admin center, go to Policies \u003E Sharing.\n2. Under Choose expiration and permissions options for Anyone links, select These links must expire within this many days and enter a value (for example 30).\n3. Consider View as the default permission for Anyone links.","PowerShell":"# Sample only - review before running.\nConnect-PnPOnline -Url \u0027https://\u003Ctenant\u003E-admin.sharepoint.com\u0027 -Interactive -ClientId \u0027\u003Capp id\u003E\u0027\nSet-PnPTenant -RequireAnonymousLinksExpireInDays 30","PortalUrl":"https://admin.microsoft.com/sharepoint?page=sharing\u0026modern=true"},"References":[{"Title":"Best practices for unauthenticated sharing","Url":"https://learn.microsoft.com/en-us/microsoft-365/solutions/best-practices-anonymous-sharing"},{"Title":"Set-SPOTenant: RequireAnonymousLinksExpireInDays","Url":"https://learn.microsoft.com/en-us/powershell/module/microsoft.online.sharepoint.powershell/set-spotenant"}],"Requires":{"Services":["Graph","SharePoint"],"GraphScopes":["SharePointTenantSettings.Read.All"],"Licenses":[],"DataSets":["SharePointTenantSettings","SharePointTenant"],"OptionalDataSets":[]},"Tags":["SharePoint","OneDrive","Sharing"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.003","Title":"Default sharing link is limited to specific people","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Sharing","Severity":"Medium","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Not connected to SharePoint Online (PnP.PowerShell).","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"Reads the default link type of the sharing dialog with PnP.PowerShell (\u0060Get-PnPTenant\u0060): \u0060CoreDefaultShareLinkScope\u0060 for SharePoint and \u0060OneDriveDefaultShareLinkScope\u0060 for OneDrive, falling back to \u0060DefaultSharingLinkType\u0060 when they are Uninitialized. Anyone as default fails; People in your organisation (or the widest allowed link) is Investigate; Specific people passes. Needs \u0060Connect-Argus -Service SharePoint\u0060; otherwise the check is Skipped.","Rationale":"Most people accept the default link. A default of Anyone or of the whole organisation turns every quick share into broad access, which is the main source of oversharing that Copilot later surfaces in answers. Specific people as default keeps sharing intentional.","Remediation":{"Steps":"1. In the SharePoint admin center, go to Policies \u003E Sharing \u003E File and folder links.\n2. Set the default link type to Specific people (only the people the user specifies).\n3. Set the default permission to View where editing is not the usual need.","PowerShell":"# Sample only - review before running.\nConnect-PnPOnline -Url \u0027https://\u003Ctenant\u003E-admin.sharepoint.com\u0027 -Interactive -ClientId \u0027\u003Capp id\u003E\u0027\nSet-PnPTenant -DefaultSharingLinkType Direct","PortalUrl":"https://admin.microsoft.com/sharepoint?page=sharing\u0026modern=true"},"References":[{"Title":"Change the default link type for SharePoint and OneDrive","Url":"https://learn.microsoft.com/en-us/sharepoint/change-default-sharing-link"},{"Title":"Set-SPOTenant: DefaultSharingLinkType and CoreDefaultShareLinkScope","Url":"https://learn.microsoft.com/en-us/powershell/module/microsoft.online.sharepoint.powershell/set-spotenant"}],"Requires":{"Services":["Graph","SharePoint"],"GraphScopes":[],"Licenses":[],"DataSets":["SharePointTenant"],"OptionalDataSets":[]},"Tags":["SharePoint","OneDrive","Sharing","Oversharing"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.006","Title":"Sites that allow Anyone links","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Sharing","Severity":"Low","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Not connected to SharePoint Online (PnP.PowerShell).","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"Site collections (PnP.PowerShell \u0060Get-PnPTenantSite\u0060, OneDrive excluded) whose own sharing setting is \u0060ExternalUserAndGuestSharing\u0060 (Anyone). Listed as Investigate: Anyone links may be intended on some sites, but each one should be known. Passes without evaluation when the organisation does not allow Anyone links. Needs \u0060Connect-Argus -Service SharePoint\u0060; otherwise the check is Skipped.","Rationale":"The organisation level sets the maximum; each site inherits it unless an administrator restricts it. Knowing which sites can create Anyone links lets you keep that capability only where it has a business owner and a reason.","Remediation":{"Steps":"1. Review the listed sites with their owners.\n2. For sites that do not need Anyone links, lower the site sharing to New and existing guests (SharePoint admin center \u003E Active sites \u003E Sharing).\n3. For sites that keep it, check ARG.SPO.004 (link expiration).","PowerShell":"# Sample only - review before running.\nConnect-PnPOnline -Url \u0027https://\u003Ctenant\u003E-admin.sharepoint.com\u0027 -Interactive -ClientId \u0027\u003Capp id\u003E\u0027\nSet-PnPTenantSite -Identity \u0027\u003Csite url\u003E\u0027 -SharingCapability ExternalUserSharingOnly","PortalUrl":"https://admin.microsoft.com/sharepoint?page=siteManagement\u0026modern=true"},"References":[{"Title":"Change the sharing settings for a site","Url":"https://learn.microsoft.com/en-us/sharepoint/change-external-sharing-site"},{"Title":"Best practices for unauthenticated sharing","Url":"https://learn.microsoft.com/en-us/microsoft-365/solutions/best-practices-anonymous-sharing"}],"Requires":{"Services":["Graph","SharePoint"],"GraphScopes":["SharePointTenantSettings.Read.All"],"Licenses":[],"DataSets":["SharePointTenantSettings","SharePointSites"],"OptionalDataSets":[]},"Tags":["SharePoint","Sharing","Inventory"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.SPO.013","Title":"OneDrives near their storage quota (more than 90%)","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Storage","Severity":"Low","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so OneDrives near their quota cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.35,"Parameters":{"QuotaPercent":90},"Description":"OneDrive accounts from the OneDrive usage report (\u0060getOneDriveUsageAccountDetail\u0060, period D180) whose \u0060Storage Used (Byte)\u0060 is more than **90%** of \u0060Storage Allocated (Byte)\u0060. Deleted accounts and accounts without an allocation are ignored. With concealed report names, or when the report returns no rows, the result is Investigate. When the report leaves \u0060Site URL\u0060 empty (a known issue of the usage reports; this report has no Site Id), the URL comes from the \u0060mySite\u0060 property of the user, or is derived from the UPN with the OneDrive naming convention when the user no longer exists (\u0060UrlSource\u0060 column).","Rationale":"A full OneDrive stops syncing and saving, and users start keeping files on local disks or personal storage. Accounts close to the limit need a cleanup, a move of team content to SharePoint, or a higher quota.","Remediation":{"Steps":"1. Ask the users to move team content to the relevant SharePoint sites and remove duplicates.\n2. Raise the OneDrive quota for users who need it (SharePoint admin center \u003E Settings \u003E OneDrive storage limit, or per user).\n3. Review the default OneDrive storage limit for new users.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/sharepoint?page=settings\u0026modern=true"},"References":[{"Title":"Set the default storage space for OneDrive users","Url":"https://learn.microsoft.com/en-us/sharepoint/set-default-storage-space"},{"Title":"Microsoft 365 reports in the admin center - OneDrive usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/onedrive-for-business-usage-ww"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All","User.Read.All","Organization.Read.All"],"Licenses":[],"DataSets":["OneDriveUsage","ReportSettings","Users","Organization"],"OptionalDataSets":[]},"Tags":["OneDrive","Storage","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.EXO.001","Title":"Shared mailboxes with sign-in enabled","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Mailbox governance","Severity":"Medium","Status":"Failed","Summary":"3 of 41 shared mailboxes have sign-in enabled.","AffectedCount":3,"EvaluatedCount":41,"ExcludedCount":0,"Findings":[{"DisplayName":"=cmd|\u0027 /C calc\u0027!A0","PrimarySmtpAddress":"events@contoso.onmicrosoft.com","UserPrincipalName":"events@contoso.onmicrosoft.com","Licensed":"No","ObjectId":"c84548dd-e889-9907-90cc-e7512bb82cdf"},{"DisplayName":"Reception","PrimarySmtpAddress":"reception@contoso.onmicrosoft.com","UserPrincipalName":"reception@contoso.onmicrosoft.com","Licensed":"Yes","ObjectId":"52aa6d94-9aa8-bd95-148d-f710d0e3d908"},{"DisplayName":"Support Desk","PrimarySmtpAddress":"support@contoso.onmicrosoft.com","UserPrincipalName":"support@contoso.onmicrosoft.com","Licensed":"No","ObjectId":"84047cbd-efef-c65f-3665-3dfc2a91e78d"}],"FindingColumns":["DisplayName","PrimarySmtpAddress","UserPrincipalName","Licensed","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":1.006,"Parameters":{},"Description":"Shared mailboxes (Exchange Online) whose user account in Microsoft Entra ID is enabled (\u0060accountEnabled\u0060 = true). People access shared mailboxes through their own accounts and mailbox permissions; the account of the shared mailbox itself does not need to sign in.","Rationale":"An enabled shared mailbox account has a password that nobody owns, is often excluded from reviews, and lets anyone who knows the password sign in directly instead of through audited delegate access.","Remediation":{"Steps":"1. Confirm that nobody signs in directly to the shared mailbox account (check its sign-in logs).\n2. Block sign-in for the account (Microsoft 365 admin center \u003E Users \u003E Block sign-in); mailbox access through permissions keeps working.\n3. Make blocking sign-in part of the process that creates or converts shared mailboxes.","PowerShell":"# Sample only - review before running. Blocks sign-in for one shared mailbox account.\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nUpdate-MgUser -UserId \u0027\u003CObjectId\u003E\u0027 -AccountEnabled:$false","PortalUrl":"https://admin.microsoft.com/Adminportal/Home#/SharedMailbox"},"References":[{"Title":"About shared mailboxes","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/email/about-shared-mailboxes"},{"Title":"Block shared mailbox accounts from signing in","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/email/create-a-shared-mailbox#block-sign-in-for-shared-mailbox-accounts"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users","Mailboxes"],"OptionalDataSets":[]},"Tags":["Exchange","Mailboxes"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.EXO.009","Title":"Distribution groups without owner","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Ownership","Severity":"Low","Status":"Failed","Summary":"7 of 96 distribution and mail-enabled security groups have no owner.","AffectedCount":7,"EvaluatedCount":96,"ExcludedCount":0,"Findings":[{"DisplayName":"DL-Alerts-1","PrimarySmtpAddress":"dl1@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","GroupId":"064900de-4305-88b3-b3fc-f1f6c8adf2de"},{"DisplayName":"DL-Branch-2","PrimarySmtpAddress":"dl2@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","GroupId":"efa8b4af-0da4-1ce3-425d-989283a66959"},{"DisplayName":"DL-Suppliers-3","PrimarySmtpAddress":"dl3@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","GroupId":"b7bfd805-c177-67d1-3b63-d53f9d90094c"},{"DisplayName":"DL-Branch-4","PrimarySmtpAddress":"dl4@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","GroupId":"b50fd938-f339-ea65-c3e5-1af53056879d"},{"DisplayName":"DL-Newsletter-5","PrimarySmtpAddress":"dl5@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","GroupId":"dc1e1aa7-f237-88d6-69aa-0edda5cc8e46"},{"DisplayName":"DL-Alerts-6","PrimarySmtpAddress":"dl6@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","GroupId":"764a906d-e5cc-cc5a-b4db-b7710a0d4da1"},{"DisplayName":"DL-Suppliers-7","PrimarySmtpAddress":"dl7@contoso.onmicrosoft.com","Type":"MailUniversalSecurityGroup","GroupId":"202eefe8-e600-2c38-d048-570c1d198baf"}],"FindingColumns":["DisplayName","PrimarySmtpAddress","Type","GroupId"],"SkipReason":null,"ErrorMessage":null,"Duration":1.864,"Parameters":{},"Description":"Distribution groups and mail-enabled security groups (Exchange Online, \u0060Get-DistributionGroup\u0060) with an empty \u0060ManagedBy\u0060 list, so only Exchange administrators can manage them.","Rationale":"Without an owner, membership and delivery restrictions of a distribution list are not maintained, nobody can approve join requests, and the list keeps sending mail to people who left or changed role.","Remediation":{"Steps":"1. Identify a responsible person for each group (for example the team or department lead).\n2. Set the owners in the Exchange admin center (Recipients \u003E Groups \u003E Settings), at least two per group.\n3. Remove groups that are no longer used.","PowerShell":"# Sample only - review before running. Sets the owners of one distribution group.\nConnect-ExchangeOnline\nSet-DistributionGroup -Identity \u0027\u003CPrimarySmtpAddress\u003E\u0027 -ManagedBy \u0027\u003Cowner1@contoso.com\u003E\u0027,\u0027\u003Cowner2@contoso.com\u003E\u0027","PortalUrl":"https://admin.exchange.microsoft.com/#/groups"},"References":[{"Title":"Create and manage distribution list groups in Exchange Online","Url":"https://learn.microsoft.com/en-us/exchange/recipients-in-exchange-online/manage-distribution-groups/manage-distribution-groups"},{"Title":"Get-DistributionGroup","Url":"https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/get-distributiongroup"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":[],"Licenses":[],"DataSets":["DistributionGroups"],"OptionalDataSets":[]},"Tags":["Exchange","Groups","Ownership"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":7},{"Id":"ARG.EXO.004","Title":"Inactive user mailboxes (more than 90 days)","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Lifecycle","Severity":"Low","Status":"NotRun","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Disabled in configuration.","ErrorMessage":null,"Duration":0.0,"Parameters":{"InactiveDays":90},"Description":"Mailboxes whose \u0060Last Activity Date\u0060 in the mailbox usage report (\u0060getMailboxUsageDetail\u0060, period D180) is older than **90** days, or empty for mailboxes created before that. When Exchange Online is connected only user mailboxes are evaluated; otherwise the report also contains shared mailboxes, which is noted in the summary. With concealed report names, or when the report returns no rows, the result is Investigate.","Rationale":"A user mailbox nobody uses usually belongs to a leaver or a forgotten test account: it keeps a licence, mail and permissions without a reason.","Remediation":{"Steps":"1. Confirm with the manager whether the mailbox is still needed.\n2. If the content must be kept, convert it to a shared mailbox or apply a hold, then remove the licence.\n3. Otherwise disable and delete the account after your retention period.","PowerShell":"","PortalUrl":"https://admin.exchange.microsoft.com/#/mailboxes"},"References":[{"Title":"Microsoft 365 reports in the admin center - Mailbox usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/mailbox-usage"},{"Title":"Convert a user mailbox to a shared mailbox","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/email/convert-user-mailbox-to-shared-mailbox"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All"],"Licenses":[],"DataSets":["MailboxUsage","ReportSettings"],"OptionalDataSets":["Mailboxes"]},"Tags":["Exchange","Lifecycle","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.EXO.006","Title":"Mailboxes near their quota (more than 90% of the warning quota)","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Storage","Severity":"Low","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so mailboxes near their quota cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.017,"Parameters":{"QuotaPercent":90},"Description":"User and shared mailboxes from the mailbox usage report (\u0060getMailboxUsageDetail\u0060, period D180) whose \u0060Storage Used (Byte)\u0060 is more than **90%** of \u0060Issue Warning Quota (Byte)\u0060 (the size at which the owner starts receiving warnings; \u0060Prohibit Send Quota\u0060 is used when no warning quota is set). The findings also show how close the mailbox is to Prohibit Send. When Exchange Online is connected the mailbox type (user, shared, room, equipment) is shown. Deleted mailboxes and mailboxes without a quota are ignored. With concealed report names, or when the report returns no rows, the result is Investigate.","Rationale":"Users can react to quota warnings, shared mailboxes cannot: nobody receives their warnings, and they stop accepting mail without notice once they reach the limit. Mailboxes past or near the warning quota need an archive, a retention policy, a cleanup or, for shared mailboxes above 50 GB, a licence.","Remediation":{"Steps":"1. Enable the archive mailbox (and auto-expanding archiving where licensed) for the listed mailboxes.\n2. Apply a retention policy that moves old items to the archive.\n3. For shared mailboxes above 50 GB, assign the licence that raises the quota.","PowerShell":"","PortalUrl":"https://admin.exchange.microsoft.com/#/mailboxes"},"References":[{"Title":"Microsoft 365 reports in the admin center - Mailbox usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/mailbox-usage"},{"Title":"Enable archive mailboxes","Url":"https://learn.microsoft.com/en-us/purview/enable-archive-mailboxes"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All"],"Licenses":[],"DataSets":["MailboxUsage","ReportSettings"],"OptionalDataSets":["Mailboxes"]},"Tags":["Exchange","Storage","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.EXO.005","Title":"User mailboxes of disabled accounts","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Lifecycle","Severity":"Low","Status":"Failed","Summary":"2 of 1,158 user mailboxes belong to disabled accounts and are not on hold. 4 more on hold are kept on purpose.","AffectedCount":2,"EvaluatedCount":1158,"ExcludedCount":0,"Findings":[{"DisplayName":"Avery Kowalski","UserPrincipalName":"avery.kowalski71@contoso.onmicrosoft.com","PrimarySmtpAddress":"avery.kowalski71@contoso.onmicrosoft.com","Licensed":"Yes","ArchiveStatus":"None","ObjectId":"0fc434db-1783-171f-5e9c-c03ba4e49e18"},{"DisplayName":"Morgan Jensen","UserPrincipalName":"morgan.jensen79@contoso.onmicrosoft.com","PrimarySmtpAddress":"morgan.jensen79@contoso.onmicrosoft.com","Licensed":"No","ArchiveStatus":"None","ObjectId":"9cfb4911-c002-c296-2bc1-5f25564dd90c"}],"FindingColumns":["DisplayName","UserPrincipalName","PrimarySmtpAddress","Licensed","ArchiveStatus","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":2.087,"Parameters":{},"Description":"User mailboxes (\u0060RecipientTypeDetails\u0060 = UserMailbox) whose Microsoft Entra account is disabled (\u0060accountEnabled\u0060 = false). Mailboxes on litigation hold or with in-place holds are counted as kept on purpose and not listed. Shared, room and equipment mailboxes are out of scope (their accounts are meant to be disabled).","Rationale":"A disabled user with a live user mailbox is a leaver process that stopped halfway: mail keeps arriving, nobody reads it, and the mailbox usually keeps a licence. Converting it to a shared mailbox, delegating it or deleting it closes the process.","Remediation":{"Steps":"1. Ask the manager whether incoming mail or content is still needed.\n2. Convert the mailbox to a shared mailbox and grant access to the manager, or set up forwarding for a limited period.\n3. Remove the licence and delete the account after the retention period; apply a hold first when legal requirements apply.","PowerShell":"","PortalUrl":"https://admin.exchange.microsoft.com/#/mailboxes"},"References":[{"Title":"Convert a user mailbox to a shared mailbox","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/email/convert-user-mailbox-to-shared-mailbox"},{"Title":"Remove a former employee from Microsoft 365","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/remove-former-employee"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users","Mailboxes"],"OptionalDataSets":[]},"Tags":["Exchange","Mailboxes","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":2},{"Id":"ARG.EXO.002","Title":"Shared mailboxes without delegates","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Ownership","Severity":"Low","Status":"Failed","Summary":"2 of 41 shared mailboxes have no FullAccess delegate.","AffectedCount":2,"EvaluatedCount":41,"ExcludedCount":0,"Findings":[{"DisplayName":"Expo 2024","PrimarySmtpAddress":"expo2024@contoso.onmicrosoft.com","UserPrincipalName":"expo2024@contoso.onmicrosoft.com","ObjectId":"ce7c1169-1519-ac72-97d1-7834ec97477a"},{"DisplayName":"Old Helpdesk","PrimarySmtpAddress":"oldhelpdesk@contoso.onmicrosoft.com","UserPrincipalName":"oldhelpdesk@contoso.onmicrosoft.com","ObjectId":"e0dd424d-c197-ed4f-55f3-55ff7769edcb"}],"FindingColumns":["DisplayName","PrimarySmtpAddress","UserPrincipalName","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":1.369,"Parameters":{},"Description":"Shared mailboxes with no explicit FullAccess permission (\u0060Get-EXOMailboxPermission\u0060: not inherited, not denied, \u0060NT AUTHORITY\\SELF\u0060 ignored). Send As and Send on Behalf permissions are not considered: without FullAccess nobody can open the mailbox. One Exchange call per shared mailbox.","Rationale":"A shared mailbox nobody can open still receives mail that nobody reads, often from customers or suppliers. Every shared mailbox should have named people responsible for it.","Remediation":{"Steps":"1. Find out who should handle the mailbox (department, previous owners, mail content).\n2. Grant FullAccess to those people, preferably through a mail-enabled security group.\n3. If the mailbox is no longer needed, set an auto-reply, then remove it after your retention period.","PowerShell":"# Sample only - review before running.\nConnect-ExchangeOnline\nAdd-MailboxPermission -Identity \u0027\u003Cshared mailbox\u003E\u0027 -User \u0027\u003Cuser or group\u003E\u0027 -AccessRights FullAccess -AutoMapping $true","PortalUrl":"https://admin.exchange.microsoft.com/#/mailboxes"},"References":[{"Title":"Manage permissions for recipients in Exchange Online","Url":"https://learn.microsoft.com/en-us/exchange/recipients-in-exchange-online/manage-permissions-for-recipients"},{"Title":"Get-EXOMailboxPermission","Url":"https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/get-exomailboxpermission"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":[],"Licenses":[],"DataSets":["Mailboxes","SharedMailboxPermissions"],"OptionalDataSets":[]},"Tags":["Exchange","Mailboxes","Ownership"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":2},{"Id":"ARG.EXO.010","Title":"Empty distribution groups","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Lifecycle","Severity":"Low","Status":"Failed","Summary":"3 of 96 distribution and mail-enabled security groups have no members.","AffectedCount":3,"EvaluatedCount":96,"ExcludedCount":0,"Findings":[{"DisplayName":"DL-Launch-2023","PrimarySmtpAddress":"dl-launch-2023@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","ManagedBy":"","GroupId":"f153aee3-f7da-8934-f06b-ee1d8d3e2a17"},{"DisplayName":"DL-Branch-Turin","PrimarySmtpAddress":"dl-branch-turin@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","ManagedBy":"","GroupId":"fc0b08aa-242c-c1a7-8f79-25c073342de3"},{"DisplayName":"DL-Supplier-Alerts","PrimarySmtpAddress":"dl-supplier-alerts@contoso.onmicrosoft.com","Type":"MailUniversalDistributionGroup","ManagedBy":"","GroupId":"e8095dad-89f4-4a72-a856-a65660cfc7b4"}],"FindingColumns":["DisplayName","PrimarySmtpAddress","Type","ManagedBy","GroupId"],"SkipReason":null,"ErrorMessage":null,"Duration":2.23,"Parameters":{},"Description":"Distribution groups and mail-enabled security groups (\u0060Get-DistributionGroup\u0060) without members, read through Microsoft Graph (\u0060GET /groups/\u003Cid\u003E/members?$top=1\u0060, sent in \u0060$batch\u0060). Groups whose members could not be read are left out of the evaluation. Dynamic distribution groups are not included.","Rationale":"An empty distribution group still accepts mail, which then reaches nobody, and clutters the address book. Empty groups are usually left over from projects or reorganisations and can be removed.","Remediation":{"Steps":"1. Check with the owner (ManagedBy) whether the group is still needed.\n2. Add the intended members, or delete the group.\n3. Before deleting, check that no mail flow rule, connector or application sends to the address.","PowerShell":"","PortalUrl":"https://admin.exchange.microsoft.com/#/groups"},"References":[{"Title":"Manage distribution groups in Exchange Online","Url":"https://learn.microsoft.com/en-us/exchange/recipients-in-exchange-online/manage-distribution-groups/manage-distribution-groups"},{"Title":"List group members","Url":"https://learn.microsoft.com/en-us/graph/api/group-list-members"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":["GroupMember.Read.All"],"Licenses":[],"DataSets":["DistributionGroups","DistributionGroupMembers"],"OptionalDataSets":[]},"Tags":["Exchange","Groups","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.EXO.003","Title":"Inactive shared mailboxes (more than 90 days)","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Lifecycle","Severity":"Low","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so inactive shared mailboxes cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":0.833,"Parameters":{"InactiveDays":90},"Description":"Shared mailboxes (Exchange Online) whose \u0060Last Activity Date\u0060 in the mailbox usage report (\u0060getMailboxUsageDetail\u0060, period D180) is older than **90** days, or empty for mailboxes created before that. The report has no recipient type, so shared mailboxes are identified through Exchange Online. With concealed report names, or when the report returns no rows, the result is Investigate.","Rationale":"Shared mailboxes created for projects, events or old processes outlive their purpose. Unused ones keep permissions, addresses and sometimes licences that nobody reviews.","Remediation":{"Steps":"1. Check with the delegates whether the mailbox is still needed.\n2. If it is not, set an auto-reply pointing to the right contact, remove permissions and licences, then delete it after your retention period.\n3. If it must be kept for records, apply a retention policy or hold.","PowerShell":"","PortalUrl":"https://admin.exchange.microsoft.com/#/mailboxes"},"References":[{"Title":"Microsoft 365 reports in the admin center - Mailbox usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/mailbox-usage"},{"Title":"About shared mailboxes","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/email/about-shared-mailboxes"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":["Reports.Read.All"],"Licenses":[],"DataSets":["MailboxUsage","ReportSettings","Mailboxes"],"OptionalDataSets":[]},"Tags":["Exchange","Mailboxes","Lifecycle","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.COP.001","Title":"Self-service purchase and trials of Copilot products are disabled","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Licence governance","Severity":"Medium","Status":"Failed","Summary":"2 of 3 Copilot products allow self-service purchases or trials.","AffectedCount":2,"EvaluatedCount":3,"ExcludedCount":0,"Findings":[{"ProductName":"Microsoft Copilot","ProductId":"CFQ7TTC0MM8R","PolicyValue":"Enabled","Allows":"Purchases and trials"},{"ProductName":"Copilot Studio (fictitious)","ProductId":"CFQ7TTC0XXXX","PolicyValue":"OnlyTrialsWithoutPaymentMethod","Allows":"Trials without payment method"}],"FindingColumns":["ProductName","ProductId","PolicyValue","Allows"],"SkipReason":null,"ErrorMessage":null,"Duration":0.643,"Parameters":{"ProductNamePattern":"Copilot"},"Description":"Reads the \u0060AllowSelfServicePurchase\u0060 policy of every product whose name contains \u0022Copilot\u0022 with the MSCommerce module (\u0060Get-MSCommerceProductPolicies\u0060). Fails when a Copilot product is \u0060Enabled\u0060 (users can buy it and start trials) or \u0060OnlyTrialsWithoutPaymentMethod\u0060 (users can start trials). MSCommerce needs \u0060Connect-Argus -Service Commerce\u0060, interactive sign-in and Windows; otherwise the check is Skipped.","Rationale":"Self-service purchases create licences, invoices and data-processing commitments outside the IT and procurement process. Copilot licences bought by individuals are not covered by the organisation\u0027s rollout plan, readiness work (oversharing, sensitivity labels) or budget.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Settings \u003E Org settings \u003E Self-service trials and purchases.\n2. Select each Copilot product and choose Do not allow.\n3. Repeat for new Copilot products when they appear: the policy is per product and new products default to allowed.","PowerShell":"# Sample only - review before running.\nImport-Module MSCommerce\nConnect-MSCommerce\nGet-MSCommerceProductPolicies -PolicyId AllowSelfServicePurchase |\n    Where-Object ProductName -match \u0027Copilot\u0027 |\n    ForEach-Object { Update-MSCommerceProductPolicy -PolicyId AllowSelfServicePurchase -ProductId $_.ProductId -Value \u0027Disabled\u0027 }","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Use AllowSelfServicePurchase for the MSCommerce PowerShell module","Url":"https://learn.microsoft.com/en-us/microsoft-365/commerce/subscriptions/allowselfservicepurchase-powershell"},{"Title":"Manage self-service purchases and trials (for admins)","Url":"https://learn.microsoft.com/en-us/microsoft-365/commerce/subscriptions/manage-self-service-purchases-admins"}],"Requires":{"Services":["Graph","Commerce"],"GraphScopes":[],"Licenses":[],"DataSets":["CommercePolicies"],"OptionalDataSets":[]},"Tags":["Copilot","Licensing","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":2},{"Id":"ARG.COP.002","Title":"Users cannot sign up for self-service trials (Copilot Studio, Power Platform)","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Licence governance","Severity":"Medium","Status":"Failed","Summary":"Users can sign up for self-service trials such as Copilot Studio (allowedToSignUpEmailBasedSubscriptions = true).","AffectedCount":1,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[{"Setting":"allowedToSignUpEmailBasedSubscriptions","Value":"True","Related":"allowEmailVerifiedUsersToJoinOrganization = False"}],"FindingColumns":["Setting","Value","Related"],"SkipReason":null,"ErrorMessage":null,"Duration":0.931,"Parameters":{},"Description":"Reads \u0060authorizationPolicy.allowedToSignUpEmailBasedSubscriptions\u0060. When it is true, users can sign themselves up for email-based (\u0022viral\u0022) subscriptions such as the Copilot Studio and Power Apps trials, and start building agents and apps without an assigned licence. \u0060allowEmailVerifiedUsersToJoinOrganization\u0060 is shown for context.","Rationale":"Self-service sign-ups put agent and app creation outside any licence, environment or data policy decision. Agents built on trial licences are hard to inventory and often stop working, or keep running, after the trial ends.","Remediation":{"Steps":"1. Decide who may build agents with Copilot Studio and assign them licences or a governed environment.\n2. Turn off self-service sign-up by setting allowedToSignUpEmailBasedSubscriptions to false in the authorization policy (PowerShell below).\n3. In the Power Platform admin center, also review who can create environments and trial environments.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027Policy.ReadWrite.Authorization\u0027\nUpdate-MgPolicyAuthorizationPolicy -AllowedToSignUpEmailBasedSubscriptions:$false","PortalUrl":"https://admin.powerplatform.microsoft.com/"},"References":[{"Title":"authorizationPolicy resource type","Url":"https://learn.microsoft.com/en-us/graph/api/resources/authorizationpolicy"},{"Title":"Copilot Studio licensing and subscriptions: self-service trials","Url":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/requirements-licensing-subscriptions"}],"Requires":{"Services":["Graph"],"GraphScopes":["Policy.Read.All"],"Licenses":[],"DataSets":["AuthorizationPolicy"],"OptionalDataSets":[]},"Tags":["Copilot","Licensing","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.COP.004","Title":"Anthropic models as a Microsoft subprocessor (manual review)","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"AI data processing","Severity":"Info","Status":"Investigate","Summary":"Verify in the admin center whether Anthropic models are enabled; no API exposes this setting. Default for this tenant: Off (No users) - tenant country IT is in the EU, EFTA or UK.","AffectedCount":2,"EvaluatedCount":2,"ExcludedCount":0,"Findings":[{"Setting":"AI providers operating as Microsoft subprocessors \u003E Anthropic","Location":"Microsoft 365 admin center \u003E Copilot \u003E Settings \u003E View all","Default":"Off (No users) - tenant country IT is in the EU, EFTA or UK","Recommended":"Enabled only after a documented decision, for approved users or groups"},{"Setting":"Copilot in Microsoft 365 apps with Anthropic models","Location":"Microsoft 365 admin center \u003E Copilot \u003E Settings \u003E View all","Default":"Separate setting for Word, Excel and PowerPoint","Recommended":"Aligned with the subprocessor decision above"}],"FindingColumns":["Setting","Location","Default","Recommended"],"SkipReason":null,"ErrorMessage":null,"Duration":1.252,"Parameters":{},"Description":"The \u0022AI providers operating as Microsoft subprocessors\u0022 setting (Microsoft 365 admin center \u003E Copilot \u003E Settings) controls whether Anthropic models can be used in Copilot, Researcher, Copilot Studio, Power Platform and Copilot in Microsoft 365 apps. No Microsoft API exposes it, so this check is always To review: it reads the tenant country (\u0060organization.countryLetterCode\u0060) and states the default that applies. Anthropic is on by default in the commercial cloud and off by default in the EU, EFTA and the UK. Info severity: it does not change the score.","Rationale":"As a Microsoft subprocessor Anthropic is covered by the Microsoft Product Terms and DPA, but Anthropic models are excluded from the EU Data Boundary and from in-country processing commitments. For organisations subject to the GDPR this is a data-transfer decision that should be documented (records of processing, DPIA where required) and limited to approved users.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Copilot \u003E Settings \u003E View all \u003E AI providers operating as Microsoft subprocessors.\n2. Check whether Anthropic is enabled and who can access it (all users, or specific users and groups).\n3. If it is enabled, record the decision and its legal basis; limit access to approved groups, or select Disable Anthropic as a Microsoft subprocessor.\n4. Also review Copilot in Microsoft 365 apps with Anthropic models, a separate setting for Word, Excel and PowerPoint.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Anthropic models in Microsoft Online Services","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/connect-to-ai-subprocessor"},{"Title":"Copilot in Microsoft 365 apps with Anthropic models","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-anthropic-apps"},{"Title":"What is the EU Data Boundary?","Url":"https://learn.microsoft.com/en-us/privacy/eudb/eu-data-boundary-learn"}],"Requires":{"Services":["Graph"],"GraphScopes":["Organization.Read.All"],"Licenses":[],"DataSets":["Organization"],"OptionalDataSets":[]},"Tags":["Copilot","AI","GDPR","Manual"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":2},{"Id":"ARG.COP.005","Title":"Anthropic models with Data Retention, independent processor (manual review)","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"AI data processing","Severity":"Info","Status":"Investigate","Summary":"Verify in the admin center that Anthropic models with Data Retention (Anthropic as independent processor) are not enabled, or only for approved groups; no API exposes this setting.","AffectedCount":1,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[{"Setting":"Anthropic models with Data Retention","Location":"Microsoft 365 admin center \u003E Copilot \u003E Settings \u003E View all","Default":"Off for all users, in every region","Recommended":"Off, unless Anthropic\u0027s Commercial Terms and DPA were approved; then only for approved groups"}],"FindingColumns":["Setting","Location","Default","Recommended"],"SkipReason":null,"ErrorMessage":null,"Duration":1.774,"Parameters":{},"Description":"\u0022Anthropic models with Data Retention\u0022 (for example some Fable- and Mythos-class models) are offered under Anthropic\u0027s own Commercial Terms and Data Processing Addendum: Anthropic acts as an independent processor, outside the Microsoft Product Terms and DPA, and retains inputs and outputs. They are off by default in every region and must be enabled explicitly in the Microsoft 365 admin center. No Microsoft API exposes the setting, so this check is always To review. Info severity: it does not change the score.","Rationale":"With these models prompts, files and responses are stored by Anthropic (most data up to 30 days, flagged content longer) under terms the organisation signs directly with Anthropic. That is a separate data-processing relationship and, for EU organisations, an international transfer that needs its own legal assessment.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Copilot \u003E Settings \u003E View all and open the Anthropic models with Data Retention setting.\n2. Check whether it was enabled and for which users or groups.\n3. Keep it off unless legal and the DPO approved Anthropic\u0027s terms; when it is enabled, restrict it to the approved groups and record the decision.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Anthropic models in Microsoft Online Services: models with Data Retention","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/connect-to-ai-subprocessor"}],"Requires":{"Services":["Graph"],"GraphScopes":[],"Licenses":[],"DataSets":[],"OptionalDataSets":[]},"Tags":["Copilot","AI","GDPR","Manual"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.COP.008","Title":"Agent creation and access are controlled (manual review)","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Agent governance","Severity":"Info","Status":"Investigate","Summary":"Verify who can use, install and build agents; no API exposes these settings.","AffectedCount":3,"EvaluatedCount":3,"ExcludedCount":0,"Findings":[{"Setting":"User access","Location":"Microsoft 365 admin center \u003E Agents \u003E Settings","Default":"All users","Recommended":"Specific users or groups, unless agents are open to everybody by decision"},{"Setting":"Agent and plugin access","Location":"Microsoft 365 admin center \u003E Agents \u003E Settings","Default":"Check the current selection","Recommended":"Only the publisher types the organisation supports"},{"Setting":"Copilot Studio makers","Location":"Power Platform admin center \u003E Environments","Default":"Every licensed user can build agents in the default environment","Recommended":"A maker security group per environment; environment creation for admins only"}],"FindingColumns":["Setting","Location","Default","Recommended"],"SkipReason":null,"ErrorMessage":null,"Duration":1.524,"Parameters":{},"Description":"Who can use and install agents (Agents \u003E Settings \u003E User access, and Agent and plugin access) is set in the Microsoft 365 admin center, and who can build agents in Copilot Studio is set per Power Platform environment. No Microsoft API exposes these settings to read-only tools, so this check is always To review and lists what to verify. ARG.COP.002 covers self-service trial sign-up. Info severity: it does not change the score.","Rationale":"When every user can build and run agents, agents connect to data, connectors and external services faster than they can be inventoried. A governed path (approved makers, approved agent types, a managed environment) keeps agents owned, reviewed and retired.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Agents \u003E Settings \u003E User access and choose Specific users or groups instead of All users if agents are not meant for everybody.\n2. In Agents \u003E Settings \u003E Agent and plugin access, allow only the agent types the organisation supports (Microsoft, your organisation, external publishers).\n3. In the Power Platform admin center, restrict environment creation to admins and limit Copilot Studio makers to a security group in each environment.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Agent settings in Microsoft 365 admin center","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings"},{"Title":"Agents admin guide for Microsoft 365","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/agent-essentials/m365-agents-admin-guide"}],"Requires":{"Services":["Graph"],"GraphScopes":[],"Licenses":[],"DataSets":[],"OptionalDataSets":[]},"Tags":["Copilot","Agents","Manual"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.COP.009","Title":"Users can register agent identity blueprints","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Agent governance","Severity":"Medium","Status":"Failed","Summary":"All users can register agent identity blueprints (allowedToCreateAgentIdentityBlueprints = true).","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":3.154,"Parameters":{},"Description":"Reads \u0060authorizationPolicy.defaultUserRolePermissions.allowedToCreateAgentIdentityBlueprints\u0060 (\u0022Users can register agent identity blueprints\u0022 in Entra ID \u003E Users \u003E User settings) from the beta endpoint (\u0060GET /beta/policies/authorizationPolicy\u0060); v1.0 does not return it and Learn does not document it yet. Fails when every user without an admin role can create agent identity blueprints, the default from the November 2026 rollout. The setting is independent of \u0022Users can register applications\u0022 (ARG.ENT.010). Skipped when the tenant does not return the property yet.","Rationale":"An agent identity blueprint is the template and credential holder for the agent identities created from it. Blueprints created by any user have no reviewed owner, purpose or permission scope, and every agent built on them inherits that gap. Restricting creation to administrators keeps agent identities inventoried and governed.","Remediation":{"Steps":"1. In the Microsoft Entra admin center, go to Entra ID \u003E Users \u003E User settings.\n2. Set \u0027Users can register agent identity blueprints\u0027 to No and save.\n3. Let administrators (or a dedicated role) create blueprints, and review the existing ones (GET /applications/microsoft.graph.agentIdentityBlueprint) for owner and purpose.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027Policy.ReadWrite.Authorization\u0027\n$body = @{ defaultUserRolePermissions = @{ allowedToCreateAgentIdentityBlueprints = $false } }\nInvoke-MgGraphRequest -Method PATCH -Uri \u0027https://graph.microsoft.com/beta/policies/authorizationPolicy/authorizationPolicy\u0027 -Body ($body | ConvertTo-Json)","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Overview of agent identities in Microsoft Entra","Url":"https://learn.microsoft.com/en-us/entra/agent-id/agent-identities"},{"Title":"Best practices for Microsoft Entra Agent ID","Url":"https://learn.microsoft.com/en-us/entra/agent-id/best-practices-agent-id"},{"Title":"agentIdentityBlueprint resource type","Url":"https://learn.microsoft.com/en-us/graph/api/resources/agentidentityblueprint"}],"Requires":{"Services":["Graph"],"GraphScopes":["Policy.Read.All"],"Licenses":[],"DataSets":["AuthorizationPolicyBeta"],"OptionalDataSets":[]},"Tags":["Copilot","Agents","Policy"],"UsesBeta":true,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.COP.010","Title":"Org-wide agent sharing is restricted (manual review)","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Agent governance","Severity":"Info","Status":"Investigate","Summary":"Verify who can share agents with the whole organisation; no API exposes this setting.","AffectedCount":1,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[{"Setting":"Sharing (agents built with Copilot Agent Builder)","Location":"Microsoft 365 admin center \u003E Agents \u003E Settings \u003E Sharing","Default":"All users","Recommended":"No users, or Specific users (approved publishers)"}],"FindingColumns":["Setting","Location","Default","Recommended"],"SkipReason":null,"ErrorMessage":null,"Duration":1.896,"Parameters":{},"Description":"The Sharing setting (Microsoft 365 admin center \u003E Agents \u003E Settings \u003E Sharing) decides who can share agents built with Copilot Agent Builder (Copilot Studio lite) with the whole organisation: All users (default), No users, or Specific users. Sharing with named people stays possible in every case. No Microsoft API exposes the setting, so this check is always To review. Info severity: it does not change the score.","Rationale":"An agent shared with everyone answers from the knowledge sources its creator chose, for every user who opens it. Restricting org-wide sharing to a few publishers keeps the agent catalogue curated and avoids duplicate or unreviewed agents reaching the whole company.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Agents \u003E Settings \u003E Sharing.\n2. Choose No users or Specific users (a group of approved publishers) instead of All users.\n3. Review agents already shared with the whole organisation on the Agents page and block or reassign the ones without an owner.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Agent settings in Microsoft 365 admin center: Sharing","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings"},{"Title":"Share and manage agents built with Microsoft 365 Copilot","Url":"https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/copilot-studio-lite-publish-agent"}],"Requires":{"Services":["Graph"],"GraphScopes":[],"Licenses":[],"DataSets":[],"OptionalDataSets":[]},"Tags":["Copilot","Agents","Sharing","Manual"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.COP.006","Title":"Web search in Copilot is a deliberate choice","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"AI data processing","Severity":"Low","Status":"Investigate","Summary":"Allow web search in Copilot is not configured: web search is available to users and its queries are outside the DPA and the EU Data Boundary.","AffectedCount":1,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[{"Setting":"Allow web search in Copilot","Value":"Not configured","PolicyId":"No tenant-level policy"}],"FindingColumns":["Setting","Value","PolicyId"],"SkipReason":null,"ErrorMessage":null,"Duration":0.363,"Parameters":{"DisabledValues":[]},"Description":"Reads the tenant-level \u0022Allow web search in Copilot\u0022 Cloud Policy setting (\u0060GET /beta/copilot/admin/policySettings/microsoft.copilot.allowwebsearch\u0060, delegated sign-in only). When the policy is not configured, web search is available in Copilot and Copilot Chat (unless optional connected experiences are disabled): To review. The meaning of each configured value is not documented, so a configured value is To review unless it is listed in the \u0060DisabledValues\u0060 parameter after you verified it in the Cloud Policy service. A group-scoped policy cannot be read by this API and is also To review.","Rationale":"With web search on, Copilot sends search queries derived from prompts (and sometimes from open documents) to Bing. Microsoft acts as data controller for those queries: the DPA, HIPAA and the EU Data Boundary do not apply to them. Whether that is acceptable is a privacy decision the organisation should take explicitly.","Remediation":{"Steps":"1. In the Microsoft 365 Apps admin center (config.office.com), open Customization \u003E Policy Management.\n2. Create or edit a policy with Allow web search in Copilot and choose Enabled, Disabled, or Disabled in Work mode only, according to the organisation\u0027s privacy decision.\n3. Record the decision; after verifying the value ARGUS shows for the disabled option, add it to the DisabledValues parameter of ARG.COP.006 in the ARGUS configuration.","PowerShell":"","PortalUrl":"https://config.office.com/officeSettings/officePolicies"},"References":[{"Title":"Data, privacy, and security for web search in Microsoft Copilot","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/manage-public-web-access"},{"Title":"Get copilotPolicySetting","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/api/admin-settings/copilotpolicysetting-get"}],"Requires":{"Services":["Graph"],"GraphScopes":["CopilotPolicySettings.Read"],"Licenses":[],"DataSets":["CopilotWebSearchPolicy"],"OptionalDataSets":[]},"Tags":["Copilot","AI","GDPR","Policy"],"UsesBeta":true,"IsCustom":false,"FindingsTotal":1},{"Id":"ARG.COP.007","Title":"Copilot enhanced personalization (memory) is a deliberate choice","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"AI data processing","Severity":"Low","Status":"Passed","Summary":"Enhanced personalization is on, except for the members of group 3f1c9a2e-0000-4000-8000-0000000000aa.","AffectedCount":0,"EvaluatedCount":1,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.545,"Parameters":{},"Description":"Reads the enhanced personalization control (\u0060GET /beta/copilot/settings/people/enhancedpersonalization\u0060). When \u0060isEnabledInOrganization\u0060 is true and no \u0060disabledForGroup\u0060 is set, Copilot memory and personalized recommendations are on for everybody: To review. Passed when the control is off, or on with a group excluded.","Rationale":"Enhanced personalization lets Copilot use each user\u0027s Teams chats, emails, meeting transcripts, usage signals and profile to remember preferences across conversations. The data stays within the user\u0027s scope, but it is a new processing purpose that privacy notices and works-council agreements may need to cover.","Remediation":{"Steps":"1. Decide with privacy and HR whether Copilot memory is allowed for everyone, nobody, or everyone except a group.\n2. To turn it off for a group, set disabledForGroup to that group\u0027s object ID; to turn it off for the organisation, set isEnabledInOrganization to false (PowerShell below).\n3. Update the privacy notice for Copilot users accordingly.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027PeopleSettings.ReadWrite.All\u0027\nInvoke-MgGraphRequest -Method PATCH -Uri \u0027https://graph.microsoft.com/beta/copilot/settings/people/enhancedpersonalization\u0027 -Body @{ disabledForGroup = \u0027\u003Cgroup-object-id\u003E\u0027 }","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Microsoft Copilot enhanced personalization control","Url":"https://learn.microsoft.com/en-us/graph/control-enhanced-personalization-privacy"},{"Title":"Get enhancedPersonalizationSetting","Url":"https://learn.microsoft.com/en-us/graph/api/enhancedpersonalizationsetting-get?view=graph-rest-beta"}],"Requires":{"Services":["Graph"],"GraphScopes":["PeopleSettings.Read.All"],"Licenses":[],"DataSets":["CopilotPersonalization"],"OptionalDataSets":[]},"Tags":["Copilot","AI","GDPR","Privacy"],"UsesBeta":true,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.COP.003","Title":"Copilot licences unuse
