/* ARGUS report - minimal.
 * Neutral greys; green for Passed, red for Failed, orange for To review (Investigate).
 * Every other status is grey and always written out. System fonts only.
 */

:root {
  color-scheme: light;
  --bg: #fafafa;
  --surface: #ffffff;
  --subtle: #f4f4f5;
  --text: #18181b;
  --text-2: #3f3f46;
  --muted: #71717a;
  --line: #e4e4e7;
  --line-strong: #d4d4d8;
  --pass: #15803d;
  --fail: #c62828;
  --pass-soft: rgba(21, 128, 61, 0.09);
  --fail-soft: rgba(198, 40, 40, 0.08);
  --other: #a1a1aa;
  --review: #ea580c;
  --review-soft: rgba(234, 88, 12, 0.09);
  --ink: #3f3f46;
  --warn: #b45309;
  --warn-soft: rgba(217, 119, 6, 0.08);
  --warn-line: rgba(217, 119, 6, 0.35);
  --focus: #18181b;
  --loss-high: #dc2626;
  --loss-mid: #ea580c;
  --loss-low: #ca8a04;
  --loss-min: #65a30d;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "SF Pro Text", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0e10;
  --surface: #151518;
  --subtle: #1c1c20;
  --text: #ececee;
  --text-2: #c8c8cd;
  --muted: #8e8e96;
  --line: #27272b;
  --line-strong: #35353b;
  --pass: #4ade80;
  --fail: #f87171;
  --pass-soft: rgba(74, 222, 128, 0.1);
  --fail-soft: rgba(248, 113, 113, 0.1);
  --other: #5e5e66;
  --review: #fb923c;
  --review-soft: rgba(251, 146, 60, 0.11);
  --ink: #c8c8cd;
  --warn: #f0a43a;
  --warn-soft: rgba(240, 164, 58, 0.1);
  --warn-line: rgba(240, 164, 58, 0.3);
  --focus: #ececee;
  --loss-high: #f87171;
  --loss-mid: #fb923c;
  --loss-low: #facc15;
  --loss-min: #a3e635;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0e10;
    --surface: #151518;
    --subtle: #1c1c20;
    --text: #ececee;
    --text-2: #c8c8cd;
    --muted: #8e8e96;
    --line: #27272b;
    --line-strong: #35353b;
    --pass: #4ade80;
    --fail: #f87171;
    --pass-soft: rgba(74, 222, 128, 0.1);
    --fail-soft: rgba(248, 113, 113, 0.1);
    --other: #5e5e66;
    --review: #fb923c;
    --review-soft: rgba(251, 146, 60, 0.11);
    --ink: #c8c8cd;
    --warn: #f0a43a;
    --warn-soft: rgba(240, 164, 58, 0.1);
    --warn-line: rgba(240, 164, 58, 0.3);
    --focus: #ececee;
  --loss-high: #f87171;
  --loss-mid: #fb923c;
  --loss-low: #facc15;
  --loss-min: #a3e635;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; }
/* Default reading size: 125 % on desktop screens (tablets and print stay at 100 %). */
@media screen and (min-width: 1000px) { html { zoom: 1.25; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
h2 { font-size: 16px; }
h3 { font-size: 13px; margin: 22px 0 6px; }
p { margin: 0 0 8px; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--subtle); padding: 1px 4px; border-radius: 4px; }
svg { flex: none; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: -9999px; }
.skip-link:focus { left: 16px; top: 8px; background: var(--surface); padding: 6px 10px; z-index: 40; }
.noscript { max-width: 1120px; margin: 24px auto; padding: 0 24px; }

main, .appbar-inner, .footer-inner { max-width: 1120px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

/* ------------------------------------------------------------------ header */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-inner { display: flex; align-items: center; gap: 14px; height: 54px; }
.brand { display: inline-flex; align-items: center; gap: 9px; }
.brand-mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--text); color: var(--bg); }
.wordmark { font-weight: 700; letter-spacing: 0.14em; font-size: 13px; }
.appbar-spacer { flex: 1; }
/* Preview label next to the wordmark, as for products released in preview. */
.preview-badge {
  font-size: 10px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1;
  color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 6px 2px; margin-left: 2px;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  color: var(--muted);
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: color 120ms ease, background-color 120ms ease, transform 120ms ease;
}
.icon-btn:hover { color: var(--text); background: var(--subtle); }
.icon-btn:active { transform: scale(0.96); }
.text-btn {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 4px 2px;
  cursor: pointer;
}
.text-btn:hover { color: var(--text); }

.hero { margin-top: 32px; }
.hero h1 { font-size: 24px; font-weight: 650; overflow-wrap: anywhere; }
.hero .meta { margin-top: 6px; color: var(--muted); font-size: 13px; }
.hero .meta span + span::before { content: "\00b7"; margin: 0 8px; color: var(--line-strong); }
.logo { max-height: 32px; max-width: 140px; margin-top: 14px; display: block; }

#notes { margin-top: 16px; }
/* Informational warning: the only use of amber in the report. */
.warn {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--text-2);
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  border-radius: 8px;
  padding: 11px 14px;
  margin: 8px 0;
}
.warn svg { color: var(--warn); margin-top: 1px; }
.warn strong { display: block; font-weight: 600; color: var(--text); margin-bottom: 2px; }

/* ------------------------------------------------------------------ overview (iris) */
.overview { padding: 30px 32px 30px; margin-top: 24px; overflow: hidden; }
/* Score spectrum: report.js sets the light and dark variables on #overview; pick the active theme. */
.overview { --spectrum: var(--spectrum-light); --score-from: var(--score-from-light, var(--text)); --score-to: var(--score-to-light, var(--text)); }
:root[data-theme="dark"] .overview { --spectrum: var(--spectrum-dark); --score-from: var(--score-from-dark, var(--text)); --score-to: var(--score-to-dark, var(--text)); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .overview { --spectrum: var(--spectrum-dark); --score-from: var(--score-from-dark, var(--text)); --score-to: var(--score-to-dark, var(--text)); }
}
.overview-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  gap: 56px;
  align-items: start;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line);
}
.overview-body {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 36px;
  align-items: center;
  margin-top: 8px;
}
.iris-wrap { display: grid; justify-items: center; gap: 6px; min-width: 0; }
.iris { width: 100%; max-width: 720px; height: auto; overflow: visible; }
.iris-fibres line { stroke: var(--line-strong); stroke-width: 0.8; opacity: 0.55; }
.iris-track { fill: none; stroke: var(--subtle); stroke-width: 7; }
.iris-score { fill: none; stroke: var(--score-to, var(--text)); stroke-width: 7; stroke-linecap: round; }
.iris-pupil { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.iris-caption { fill: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.24em; }
.iris-value { fill: var(--score-to, var(--text)); font-size: 60px; font-weight: 650; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.iris-pct { fill: var(--muted); font-size: 26px; font-weight: 550; letter-spacing: 0; }
.iris-grade { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.18em; }
.iris-tick { cursor: pointer; transform-origin: 360px 280px; transition: opacity 140ms ease; animation: iris-in 560ms cubic-bezier(0.23, 1, 0.32, 1) both; }
.iris-tick.s-pass { fill: var(--pass); }
.iris-tick.s-fail { fill: var(--fail); }
.iris-tick.s-review { fill: var(--review); }
.iris-tick.s-other { fill: var(--other); opacity: 0.75; }
.iris:hover .iris-tick { opacity: 0.35; }
.iris:hover .iris-tick:hover { opacity: 1; }
.iris-arc { fill: none; stroke: var(--line-strong); stroke-width: 1; }
.iris-label { cursor: pointer; outline: none; }
.iris-label-name { fill: var(--text-2); font-size: 15px; font-weight: 600; }
.iris-label-score { fill: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.iris-label:hover .iris-label-name, .iris-label:focus-visible .iris-label-name { fill: var(--text); text-decoration: underline; }
.iris-label:hover .iris-arc, .iris-label:focus-visible .iris-arc { stroke: var(--text); }
@keyframes iris-in { from { opacity: 0; transform: scale(0.94); } }
.iris-legend { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 0; padding: 0; font-size: 12px; color: var(--text-2); }
.iris-legend li { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.key.pass { background: var(--pass); }
.key.fail { background: var(--fail); }
.key.review { background: var(--review); }
.key.other { background: var(--other); opacity: 0.7; }

.brief { min-width: 0; }

/* Headline score: big percentage, grade pill and the grade scale. */
.score-block, .assessment { min-width: 0; }
.score-row { display: flex; align-items: flex-end; gap: 22px; margin-top: 6px; flex-wrap: wrap; }
.score-big { display: flex; align-items: baseline; line-height: 0.9; color: var(--text); }
.score-big b { font-size: 88px; color: var(--text); font-weight: 680; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.has-score .score-big b {
  background: linear-gradient(120deg, var(--score-from), var(--score-to)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.score-big span { font-size: 34px; font-weight: 550; color: var(--muted); margin-left: 4px; }
.score-side { display: grid; gap: 8px; justify-items: start; padding-bottom: 6px; }
.grade-pill {
  font-size: 12px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text); border: 1px solid var(--score-to, var(--line-strong)); border-radius: 999px; padding: 4px 12px;
}
.score-points { font-size: 12.5px; color: var(--muted); }
.scale { position: relative; margin-top: 20px; }
.scale-track { display: flex; gap: 3px; height: 8px; }
.scale-band { position: relative; background-color: var(--subtle); background-image: var(--spectrum, none); background-repeat: no-repeat; border-radius: 2px; overflow: hidden; }
.scale-band.current { box-shadow: inset 0 0 0 1px var(--line-strong); }
/* Veils the part of the spectrum above the score. */
.scale-rest { position: absolute; top: 0; bottom: 0; right: 0; background: var(--surface); opacity: 0.8; }
.scale-marker {
  position: absolute; top: -5px; width: 2px; height: 18px; margin-left: -1px; border-radius: 1px;
  background: var(--text); box-shadow: 0 0 0 3px var(--surface);
}
.scale-labels { display: flex; gap: 3px; margin-top: 8px; }
.scale-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.scale-label.current { color: var(--text); }
.scale-num { font-weight: 450; letter-spacing: 0; margin-left: 5px; opacity: 0.8; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.eyebrow.spaced { margin-top: 26px; margin-bottom: 10px; }
.verdict { font-size: 27px; font-weight: 620; letter-spacing: -0.025em; line-height: 1.18; margin-top: 8px; text-wrap: balance; }
.verdict-sub { margin-top: 10px; color: var(--text-2); font-size: 14px; text-wrap: pretty; }
.brief .partial { color: var(--fail); font-size: 13px; }
.totals { display: flex; gap: 30px; margin-top: 22px; flex-wrap: wrap; }
.total { font: inherit; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--text); transition: transform 120ms ease; }
.total:active { transform: scale(0.97); }
.total b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.total span { font-size: 12.5px; color: var(--muted); }
.total.pass b { color: var(--pass); }
.total.fail b { color: var(--fail); }
.total.review b { color: var(--review); }
.total[aria-pressed="true"] span { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
.brief .totals { margin-top: 12px; }
.other-detail { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

.sev-strip { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sev-cell { padding: 8px 10px; display: grid; gap: 1px; }
.sev-cell + .sev-cell { border-left: 1px solid var(--line); }
.sev-cell b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.sev-cell span { font-size: 11px; color: var(--muted); }
.sev-cell.has b { color: var(--fail); }
.sev-cell.has { background: var(--fail-soft); }

.priorities { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.priorities li { border-bottom: 1px solid var(--line); }
.priority {
  font: inherit; color: var(--text); text-align: left; background: none; border: 0; cursor: pointer;
  width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 2px;
}
.p-rank { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.p-body { min-width: 0; display: grid; }
.p-title { font-size: 13.5px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-meta { font-size: 11.5px; color: var(--muted); }
.p-count { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fail); font-size: 13.5px; }
.priority:hover .p-title { text-decoration: underline; text-underline-offset: 3px; }

/* ------------------------------------------------------------------ area cards */
.area-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.area-card {
  font: inherit;
  color: var(--text);
  text-align: left;
  display: grid;
  gap: 12px;
  padding: 16px 18px;
  cursor: pointer;
  transition: border-color 120ms ease;
}
.area-card:hover { border-color: var(--line-strong); }
.area-card[aria-pressed="true"] { border-color: var(--text); }
.area-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.area-name { font-weight: 600; }
.area-score b { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.area-score span { font-size: 12px; color: var(--muted); margin-left: 4px; }
.stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--subtle); gap: 2px; }
.stack span { display: block; height: 100%; }
.seg-pass { background: var(--pass); }
.seg-fail { background: var(--fail); }
.seg-review { background: var(--review); }
.seg-other { background: var(--other); opacity: 0.45; }
.area-counts { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.area-counts b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* "Where the score is lost": fills the rest of the last row of area cards. */
.area-loss { grid-column: span var(--span3, 3); display: grid; gap: 4px; align-content: start; padding: 14px 18px 10px; }
.loss-head { display: inline-flex; align-items: center; gap: 8px; }
.loss-total { font-size: 12px; }
.loss-expand { width: 28px; height: 28px; margin: -6px -8px -6px 0; }

/* Line chart of points lost per area: one neutral series, drawn when it scrolls into view. */
.loss-chart { position: relative; }
.loss-svg { display: block; width: 100%; height: auto; overflow: visible; }
.loss-axis { stroke: var(--line-strong); stroke-width: 1; }
.loss-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.loss-tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.loss-area { fill: var(--text); opacity: 0; transition: opacity 700ms ease 350ms; }
.loss-line {
  fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1100ms cubic-bezier(0.65, 0, 0.35, 1);
}
.loss-dot {
  fill: var(--surface); stroke: var(--text); stroke-width: 2; opacity: 0;
  transform-box: fill-box; transform-origin: center; transform: scale(0.4);
  transition: opacity 260ms ease, transform 260ms cubic-bezier(0.23, 1, 0.32, 1);
}
.loss-dot.is-max { fill: var(--text); }
.loss-chart.is-drawn .loss-line { stroke-dashoffset: 0; }
.loss-chart.is-drawn .loss-area { opacity: 0.12; }
.loss-chart.is-drawn .loss-dot { opacity: 1; transform: scale(1); }
.loss-chart.is-drawn .loss-dot.is-active { transform: scale(1.35); transition-delay: 0ms !important; }
.loss-xlabel { fill: var(--muted); font-size: 11.5px; }
.loss-maxlabel { fill: var(--text-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.loss-guide { stroke: var(--line-strong); stroke-width: 1; opacity: 0; transition: opacity 120ms ease; }
.loss-chart.is-hover .loss-guide { opacity: 1; }
.loss-hit { fill: transparent; cursor: pointer; }
.loss-tip {
  position: absolute; z-index: 2; pointer-events: none; display: grid; gap: 1px; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 12px)); padding: 7px 10px; font-size: 12px; color: var(--text);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14); opacity: 0; transition: opacity 120ms ease;
}
.loss-tip[data-edge="start"] { transform: translate(-12px, calc(-100% - 12px)); }
.loss-tip[data-edge="end"] { transform: translate(calc(-100% + 12px), calc(-100% - 12px)); }
.loss-tip b { font-weight: 600; }
.loss-chart.is-hover .loss-tip { opacity: 1; }

/* Detailed view (modal dialog). */
.loss-dialog {
  position: fixed; inset: 0; margin: auto; width: min(820px, calc(100vw - 48px)); height: fit-content;
  max-height: min(540px, 62vh); padding: 0; overflow: hidden;
  color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
}
.loss-dialog[open] { animation: loss-dialog-in 220ms cubic-bezier(0.23, 1, 0.32, 1); }
.loss-dialog::backdrop { background: rgba(9, 9, 11, 0.55); }
@keyframes loss-dialog-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
.loss-dialog[open] { display: flex; flex-direction: column; }
/* A zoom, not a full-screen view: at most 540px or 62% of the viewport; the table scrolls inside. */
.loss-dialog-body { flex: 1 1 auto; min-height: 0; padding: 18px 22px 14px; display: flex; flex-direction: column; gap: 10px; }
.loss-dialog .loss-chart { flex: none; }
.loss-dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

.loss-table-wrap { flex: 1 1 auto; min-height: 96px; overflow: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); }

/* ------------------------------------------------------------------ toolbar */
.toolbar {

}
.tabs { display: flex; gap: 18px; }
.tab {

}
.tab:hover { color: var(--text); }

.toolbar-end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
input[type="search"] {

  font-size: 13px;

/* ------------------------------------------------------------------ groups + rows */
details.group { margin-top: 16px; overflow: hidden; }

  align-items: center;
  gap: 12px;

  flex-wrap: wrap;
}
details > summary::-webkit-details-marker { display: none; }

.group-score { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.group-score b { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }

.row-grid { display: grid; grid-template-columns: 14px 92px 96px minmax(0, 1fr) 80px 76px; gap: 14px; align-items: center; }
.col-head { padding: 8px 18px; font-size: 12px; color: var(--muted); background: var(--subtle); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.col-head span:last-child { text-align: right; }
.sort-head {
  font: inherit;
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
}
.sort-head:hover { color: var(--text); }
.sort-head[aria-sort="ascending"], .sort-head[aria-sort="descending"] { color: var(--text); font-weight: 600; }
.sort-head[aria-sort="ascending"]::after { content: " \2191"; }
.sort-head[aria-sort="descending"]::after { content: " \2193"; }

details.check + details.check { border-top: 1px solid var(--line); }
details.check > summary { list-style: none; cursor: pointer; padding: 11px 18px; }
details.check > summary:hover { background: var(--subtle); }
details.check[open] { border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
details.check[open] > summary { background: var(--subtle); }
details.check[open] > summary .c-title { font-weight: 600; }
.c-id { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.c-title { overflow-wrap: anywhere; }
.c-sev { font-size: 12.5px; color: var(--text-2); }
.c-affected { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }

.badge {

.badge.fail { color: var(--fail); background: var(--fail-soft); border-color: transparent; }
.badge.review { color: var(--review); background: var(--review-soft); border-color: transparent; }

/* ------------------------------------------------------------------ detail */
.detail {
  margin: 0 18px 0 46px;
  padding: 18px 22px 16px;

}
.detail.pass { border-left-color: var(--pass); }
.detail.fail { border-left-color: var(--fail); }

.detail-summary { font-size: 15px; color: var(--text); margin-bottom: 14px; }
.reason { font-size: 13px; color: var(--text-2); background: var(--subtle); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; }

table { border-collapse: collapse; width: 100%; font-size: 12.5px; }

td { color: var(--text-2); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.findings-table thead th { position: sticky; top: 0; z-index: 1; }

/* Excel-like findings table: one line per cell, resizable columns, horizontal scroll when wide. */
table.resizable { table-layout: fixed; border-collapse: separate; border-spacing: 0; }
table.resizable th, table.resizable td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.resizable th { padding-right: 14px; border-right: 1px solid var(--line); }
table.resizable td { border-right: 1px solid var(--line); }
table.resizable th:last-child, table.resizable td:last-child { border-right: 0; }
.th-label { display: block; overflow: hidden; text-overflow: ellipsis; }
.col-resizer { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; z-index: 2; touch-action: none; }
.col-resizer::after { content: ""; position: absolute; top: 25%; right: 3px; width: 2px; height: 50%; border-radius: 1px; background: transparent; transition: background-color 120ms ease; }
th:hover .col-resizer::after { background: var(--line-strong); }

th.sortable[aria-sort="descending"]::after { content: " \2193"; }

.params { font-size: 12.5px; color: var(--muted); margin-top: 16px; }

.check-nav {

  margin: 0 18px 0 46px;
  padding: 12px 0 16px;

  .overview, .area-card, details.group > summary { break-inside: avoid; }
  .overview-body { grid-template-columns: 1.1fr 1fr; gap: 24px; }
  .overview-head { gap: 32px; }
  .iris-tick { animation: none; }

  .loss-line { stroke-dashoffset: 0; transition: none; }
  .loss-area { opacity: 0.12; transition: none; }
  .loss-dot { opacity: 1; transform: none; transition: none; }
  .loss-tip, .loss-guide { display: none; }
  details.check { break-inside: avoid-page; }
  .findings-table { max-height: none; overflow: visible; }
  .findings-table thead th { position: static; }

  table.resizable { table-layout: auto; width: 100% !important; }
  table.resizable col { width: auto !important; }
  table.resizable th, table.resizable td { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
  .col-resizer { display: none; }
  .refs a::after { content: " (" attr(href) ")"; font-size: 9.5px; overflow-wrap: anywhere; }
}

3. Register phishing-resistant credentials (passkey/FIDO2 or certificate) different from the ones used by daily administrators, store them in separate safe locations, exclude the accounts from blocking Conditional Access policies and alert on every sign-in.\n4. List the accounts in this check\u0027s Accounts parameter and test them at least every 90 days.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_IAM/RolesManagementMenuBlade/~/AllRoles"},"References":[{"Title":"Manage emergency access admin accounts in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access"},{"Title":"Best practices for Microsoft Entra roles","Url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All","RoleManagement.Read.Directory","GroupMember.Read.All"],"Licenses":[],"DataSets":["Users","DirectoryRoles"],"OptionalDataSets":[]},"Tags":["Roles","Privileged access","Resilience"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":2},{"Id":"ARG.ENT.005","Title":"Guests inactive for more than 90 days","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"External identities","Severity":"Medium","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Entra ID P1 licence (AAD_PREMIUM) not detected.","ErrorMessage":null,"Duration":0.0,"Parameters":{"InactiveDays":90},"Description":"Enabled guest accounts that accepted their invitation but have not signed in for **90** days, including guests that never signed in and were added more than 90 days ago. Guests still pending acceptance are covered by ARG.ENT.004.","Rationale":"Guests keep access to Teams, sites and files after the collaboration has ended. Removing inactive guests limits what external people can still reach.","Remediation":{"Steps":"1. Confirm with the sponsor or group owners that the collaboration has ended.\n2. Block sign-in or delete the guest account.\n3. Consider recurring access reviews for guests (Entra ID P2 or ID Governance).","PowerShell":"# Sample only - review before running. Deletes one guest account (restorable for 30 days).\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nRemove-MgUser -UserId \u0027\u003CObjectId\u003E\u0027","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Manage inactive user accounts in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity/monitoring-health/howto-manage-inactive-user-accounts"},{"Title":"Manage guest access with access reviews","Url":"https://learn.microsoft.com/en-us/entra/id-governance/manage-guest-access-with-access-reviews"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All","AuditLog.Read.All"],"Licenses":["AAD_PREMIUM"],"DataSets":["Users"],"OptionalDataSets":[]},"Tags":["Guests","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.004","Title":"Guests that never accepted the invitation (more than 30 days)","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"External identities","Severity":"Medium","Status":"Failed","Summary":"14 of 212 guests have not accepted their invitation for 30\u002B days.","AffectedCount":14,"EvaluatedCount":212,"ExcludedCount":0,"Findings":[{"DisplayName":"Casey Dubois","Mail":"casey.dubois14@fabrikam.example","ObjectId":"2cd5a2ac-0a9a-9d51-9209-5cbf6460a214","InvitedOn":"2026-08-22T09:53:00Z","DaysPending":58},{"DisplayName":"Taylor Kowalski","Mail":"taylor.kowalski28@fabrikam.example","ObjectId":"82bad53a-cebf-1afe-1603-c4928cda3f56","InvitedOn":"2026-07-05T18:50:00Z","DaysPending":106},{"DisplayName":"Avery Bianchi","Mail":"avery.bianchi47@fabrikam.example","ObjectId":"1c78ddaa-d9e9-cda6-6be5-593aaf71cd1a","InvitedOn":"2026-03-29T05:52:00Z","DaysPending":204},{"DisplayName":"Riley Ferri","Mail":"riley.ferri39@fabrikam.example","Ob gDays":30},"Description":"Guest accounts whose \u0060externalUserState\u0060 is still **PendingAcceptance** more than **30** days after they were invited (\u0060externalUserStateChangeDateTime\u0060, or \u0060createdDateTime\u0060 when not set).","Rationale":"Unredeemed invitations clutter the directory, are often typos or abandoned collaborations, and can be redeemed later by whoever controls the mailbox.","Remediation":{"Steps":"1. Check with the person who invited the guest whether the collaboration is still needed.\n2. Resend the invitation if it is, otherwise delete the guest account.","PowerShell":"# Sample only - review before running. Deletes one pending guest.\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nRemove-MgUser -UserId \u0027\u003CObjectId\u003E\u0027","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Microsoft Entra B2B collaboration invitation redemption","Url":"https://learn.microsoft.com/en-us/entra/external-id/redemption-experience"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users"],"OptionalDataSets":[]},"Tags":["Guests","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":14},{"Id":"ARG.ENT.012","Title":"LinkedIn account connections disabled","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"User settings","Severity":"Low","Status":"Investigate","Summary":"Manual verification required: the LinkedIn account connections setting cannot be read through Microsoft Graph. Check it in the Microsoft Entra admin center (Users \u003E User settings); it should be No, or limited to a selected group.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":0.246,"Parameters":{},"Description":"The LinkedIn account connections setting (Microsoft Entra admin center \u003E Users \u003E User settings) lets users connect their work account to LinkedIn in Microsoft apps. It is enabled by default, except for organisations provisioned in Germany or France. Microsoft Graph has no documented API to read this setting, so ARGUS cannot evaluate it: the result is always Investigate and the setting must be checked manually. Expected value: **No** (or Selected group, if a business need was approved).","Rationale":"Once a user consents, Microsoft apps exchange profile and connection data between the work account and LinkedIn. Whether to allow it is an organisation decision about data sharing with a third-party service, and it should be explicit rather than left at the default.","Remediation":{"Steps":"1. Open the Microsoft Entra admin center \u003E Users \u003E User settings.\n2. Under LinkedIn account connections, check the current value.\n3. Select No, or Selected group with a group of approved users, and save.\n4. Record the decision; ARGUS will keep reporting this check as Investigate because the value cannot be read.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserManagementMenuBlade/~/UserSettings"},"References":[{"Title":"Admin consent for LinkedIn account connections","Url":"https://learn.microsoft.com/en-us/entra/identity/users/linkedin-integration"},{"Title":"LinkedIn account connections data sharing and consent","Url":"https://learn.microsoft.com/en-us/entra/identity/users/linkedin-user-consent"}],"Requires":{"Services":["Graph"],"GraphScopes":[],"Licenses":[],"DataSets":[],"OptionalDataSets":[]},"Tags":["User settings","Manual"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.008","Title":"Global Administrator count outside 2 to 4","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Privileged access","Severity":"High","Status":"Failed","Summary":"6 Global Administrators found (active assignments); the recommended range is 2 to 4. Eligible PIM assignments not evaluated: Entra ID P2 not detected.","AffectedCount":6,"EvaluatedCount":6,"ExcludedCount":0,"Findings":[{"DisplayName":"Break Glass 01","UserPrincipalName":"breakglass01@contoso.onmicrosoft.com","ObjectId":"3b5c9716-8097-b71b-3b09-25c7794b6262","AssignmentType":"Active","Via":"Direct"},{"DisplayName":"Elena Novak","UserPrincipalName":"elena.novak78@contoso.onmicrosoft.com","ObjectId":"43889c48-3601-fba0-750e-79331b279b79","AssignmentType":"Active","Via":"Direct"},{"DisplayName":"Avery Silva","UserPrincipalName":"avery.silva84@contoso.onmicrosoft.com","ObjectId":"b6b6ccd1-f91f-93cf-a961-c8a06f47cc3d","AssignmentType":"Active","Via":"Direct"},{"DisplayName":"Riley Conti","UserPrincipalName":"riley.conti62@contoso.onmicrosoft.com","ObjectId":"84f6055b-a9a5-d6c1-0aa0-ddd1339723ee","AssignmentType":"Active","Via":"Direct"},{"DisplayName":"Sam Smith","UserPrincipalName":"sam.smith16@contoso.onmicrosoft.com","ObjectId":"a2324968-9af7-6eac-0aeb-4ee9deebd96f","AssignmentType":"Active","Via":"Direct"},{"DisplayName":"Robin Moretti","UserPrincipalName":"robin.moretti27@contoso.onmicrosoft.com","ObjectId":"235e0d11-f3c4-90cb-9509-4b58e0acd725","AssignmentType":"Active","Via":"Group: Tier0-Admins"}],"FindingColumns":["DisplayName","UserPrincipalName","ObjectId","AssignmentType","Via"],"SkipReason":null,"ErrorMessage":null,"Duration":0.398,"Parameters":{"MinCount":2,"MaxCount":4},"Description":"Counts the distinct holders of the Global Administrator role: active assignments and, with Entra ID P2, eligible (PIM) assignments. Members of role-assignable groups that hold the role are counted individually. Fails when the count is below **2** or above **4**. Global exclusions are not applied: emergency-access accounts must be counted.","Rationale":"Too few Global Administrators risks losing control of the tenant; too many makes the most powerful role hard to govern. Keep two emergency-access accounts plus a small number of named administrators, and delegate the rest to least-privileged roles.","Remediation":{"Steps":"1. Keep two cloud-only emergency-access accounts with permanent Global Administrator assignments.\n2. Move day-to-day administration to least-privileged roles (User, Exchange, SharePoint, Teams Administrator...).\n3. With Entra ID P2, make the remaining Global Administrator assignments eligible in PIM instead of permanent.","PowerShell":"# Sample only - review before running. Lists current Global Administrator assignments.\nConnect-MgGraph -Scopes \u0027RoleManagement.Read.Directory\u0027\nGet-MgRoleManagementDirectoryRoleAssignment -Filter \u0022roleDefinitionId eq \u002762e90394-69f5-4237-9190-012177145e10\u0027\u0022 -ExpandProperty principal","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Best practices for Microsoft Entra roles","Url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices"},{"Title":"Manage emergency access admin accounts","Url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access"}],"Requires":{"Services":["Graph"],"GraphScopes":["RoleManagement.Read.Directory","GroupMember.Read.All"],"Licenses":[],"DataSets":["DirectoryRoles"],"OptionalDataSets":[]},"Tags":["Roles","Privileged access"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":6},{"Id":"ARG.ENT.009","Title":"Directory roles assigned to guests","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Privileged access","Severity":"High","Status":"Passed","Summary":"No directory role is assigned to a guest (143 assignments evaluated).","AffectedCount":0,"EvaluatedCount":143,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":2.165,"Parameters":{},"Description":"Any Microsoft Entra directory role (active, or eligible with Entra ID P2) held by a guest account, directly or through a role-assignable group.","Rationale":"Administrative roles should be held by accounts the organisation controls. A guest account follows the lifecycle of another tenant: when the person leaves their company, nobody here is notified.","Remediation":{"Steps":"1. Confirm why the guest needs the role (often a supplier or a former consultant).\n2. Remove the role assignment from the guest.\n3. If the access is still needed, create an internal account for the person, or use a partner relationship (GDAP) for service providers.","PowerShell":"# Sample only - review before running. Removes one role assignment.\nConnect-MgGraph -Scopes \u0027RoleManagement.ReadWrite.Directory\u0027\nRemove-MgRoleManagementDirectoryRoleAssignment -UnifiedRoleAssignmentId \u0027\u003CAssignmentId\u003E\u0027","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Best practices for Microsoft Entra roles","Url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices"},{"Title":"Default user permissions (guests)","Url":"https://learn.microsoft.com/en-us/entra/fundamentals/users-default-permissions"}],"Requires":{"Services":["Graph"],"GraphScopes":["RoleManagement.Read.Directory","GroupMember.Read.All"],"Licenses":[],"DataSets":["DirectoryRoles"],"OptionalDataSets":[]},"Tags":["Roles","Guests","Privileged access"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.013","Title":"Security groups without owners","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Group governance","Severity":"Low","Status":"Failed","Summary":"22 of 318 security groups have no owner.","AffectedCount":22,"EvaluatedCount":318,"ExcludedCount":0,"Findings":[{"DisplayName":"SG-HR-Project","GroupId":"b63bf8ea-bbea-ffb6-e559-27aa14a380d8","Members":100,"Created":"2025-06-20T04:23:00Z"},{"DisplayName":"SG-IT-Project","GroupId":"be641709-6e92-063d-c6ce-4617db5e18d2","Members":79,"Created":"2021-08-15T03:43:00Z"},{"DisplayName":"SG-Ops-Readers","GroupId":"a1e13baa-3c44-fe2c-1ae4-bcb2d3e0e0d6","Members":69,"Created":"2025-10-04T19:19:00Z"},{"DisplayName":"SG-Sales-VPN","GroupId":"92e18b1f-4538-0567-63ed-63725f5fdc82","Members":52,"Created":"2022-06-06T13:50:00Z"},{"DisplayName":"SG-Sa ws devices, make sure BitLocker recovery keys you still need are kept, and do not delete Windows Autopilot devices from Entra ID directly.","PowerShell":"# Sample only - review before running. Disables one device.\nConnect-MgGraph -Scopes \u0027Device.ReadWrite.All\u0027\nUpdate-MgDevice -DeviceId \u0027\u003CId\u003E\u0027 -AccountEnabled:$false","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"How to manage stale devices in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity/devices/manage-stale-devices"}],"Requires":{"Services":["Graph"],"GraphScopes":["Device.Read.All"],"Licenses":[],"DataSets":["Devices"],"OptionalDataSets":[]},"Tags":["Devices","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3000},{"Id":"ARG.ENT.003","Title":"Guest invitations are restricted","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"External identities","Severity":"Medium","Status":"Investigate","Summary":"Guest invitations are allowed for admins, guest inviters and all members (allowInvitesFrom = adminsGuestInvitersAndAllMembers).","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":0.86,"Parameters":{},"Description":"Reads who can invite guests (\u0060authorizationPolicy.allowInvitesFrom\u0060): **none** or **adminsAndGuestInviters** pass; **adminsGuestInvitersAndAllMembers** (all members can invite) needs review; **everyone** (guests can invite other guests too) fails.","Rationale":"Who can bring external people into the tenant is a governance decision. Letting guests invite other guests removes the organisation from that decision.","Remediation":{"Steps":"1. In the Microsoft Entra admin center, go to External Identities \u003E External collaboration settings.\n2. Under Guest invite settings, choose \u0027Only users assigned to specific admin roles can invite guest users\u0027, or at least prevent guests from inviting.\n3. Give the Guest Inviter role to the people who need to invite partners.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027Policy.ReadWrite.Authorization\u0027\nUpdate-MgPolicyAuthorizationPolicy -AllowInvitesFrom \u0027adminsAndGuestInviters\u0027","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Configure external collaboration settings","Url":"https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure"}],"Requires":{"Services":["Graph"],"GraphScopes":["Policy.Read.All"],"Licenses":[],"DataSets":["AuthorizationPolicy"],"OptionalDataSets":[]},"Tags":["Guests","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.010","Title":"Users can register applications","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Application governance","Severity":"Medium","Status":"Failed","Summary":"All users can register applications (defaultUserRolePermissions.allowedToCreateApps = true).","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.347,"Parameters":{},"Description":"Reads \u0060authorizationPolicy.defaultUserRolePermissions.allowedToCreateApps\u0060 (\u0022Users can register applications\u0022 in User settings). Fails when every user can create app registrations.","Rationale":"App registrations created by anyone end up without an owner, a purpose or a credential policy. Restricting creation to the Application Developer role keeps the application estate governable.","Remediation":{"Steps":"1. In the Microsoft Entra admin center, go to Users \u003E User settings.\n2. Set \u0027Users can register applications\u0027 to No.\n3. Assign the Application Developer role to the people who need to register applications.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027Policy.ReadWrite.Authorization\u0027\nUpdate-MgPolicyAuthorizationPolicy -DefaultUserRolePermissions @{ AllowedToCreateApps = $false }","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Delegate application management permissions","Url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/delegate-app-roles"},{"Title":"Default user permissions","Url":"https://learn.microsoft.com/en-us/entra/fundamentals/users-default-permissions"}],"Requires":{"Services":["Graph"],"GraphScopes":["Policy.Read.All"],"Licenses":[],"DataSets":["AuthorizationPolicy"],"OptionalDataSets":[]},"Tags":["Applications","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.011","Title":"Users can create tenants","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Tenant governance","Severity":"Low","Status":"Passed","Summary":"Non-admin users cannot create tenants.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.877,"Parameters":{},"Description":"Reads \u0060authorizationPolicy.defaultUserRolePermissions.allowedToCreateTenants\u0060 (\u0022Restrict non-admin users from creating tenants\u0022 in User settings). Fails when non-admin users can create Microsoft Entra tenants.","Rationale":"A tenant created by a user becomes a separate directory where that user is Global Administrator, outside the organisation\u0027s governance and visibility.","Remediation":{"Steps":"1. In the Microsoft Entra admin center, go to Users \u003E User settings.\n2. Set \u0027Restrict non-admin users from creating tenants\u0027 to Yes.\n3. Assign the Tenant Creator role to anyone who legitimately needs to create tenants.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027Policy.ReadWrite.Authorization\u0027\nUpdate-MgPolicyAuthorizationPolicy -DefaultUserRolePermissions @{ AllowedToCreateTenants = $false }","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Default user permissions (restrict tenant creation)","Url":"https://learn.microsoft.com/en-us/entra/fundamentals/users-default-permissions"}],"Requires":{"Services":["Graph"],"GraphScopes":["Policy.Read.All"],"Licenses":[],"DataSets":["AuthorizationPolicy"],"OptionalDataSets":[]},"Tags":["Policy","Tenant"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.015","Title":"Directory synchronisation is up to date","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Hybrid identity","Severity":"Medium","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Cloud-only tenant: directory synchronisation is not enabled.","ErrorMessage":null,"Duration":0.0,"Parameters":{"MaxSyncAgeHours":24},"Description":"For hybrid tenants (\u0060organization.onPremisesSyncEnabled\u0060 = true), fails when the last directory synchronisation (\u0060onPremisesLastSyncDateTime\u0060) is older than **24** hours. Cloud-only tenants are skipped.","Rationale":"When synchronisation stops, changes made on-premises (leavers disabled, group changes) no longer reach Microsoft 365, and governance decisions are based on stale data.","Remediation":{"Steps":"1. Check the Microsoft Entra Connect (or Cloud Sync) server and its service.\n2. Review synchronisation errors in Microsoft Entra Connect Health.\n3. If synchronisation was decommissioned on purpose, turn it off in the tenant so the state is explicit.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Using Microsoft Entra Connect Health with sync","Url":"https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-health-sync"}],"Requires":{"Services":["Graph"],"GraphScopes":["Organization.Read.All"],"Licenses":[],"DataSets":["Organization"],"OptionalDataSets":[]},"Tags":["Hybrid","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.APP.002","Title":"Client secrets expiring within 30 days","Area": ret after the service was updated.\nConnect-MgGraph -Scopes \u0027Application.ReadWrite.All\u0027\nRemove-MgApplicationPassword -ApplicationId \u0027\u003CObjectId\u003E\u0027 -KeyId \u0027\u003CKeyId\u003E\u0027","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Add and manage app credentials in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials"},{"Title":"Security best practices for application properties","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/security-best-practices-for-app-registration"}],"Requires":{"Services":["Graph"],"GraphScopes":["Application.Read.All"],"Licenses":[],"DataSets":["Applications"],"OptionalDataSets":[]},"Tags":["Applications","Credentials"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":4},{"Id":"ARG.APP.003","Title":"Expired client secrets still present","Area":"Applications","AreaDisplayName":"Applications","Category":"Credential hygiene","Severity":"Low","Status":"Failed","Summary":"9 expired client secrets are still present on 7 app registrations.","AffectedCount":9,"EvaluatedCount":162,"ExcludedCount":0,"Findings":[{"DisplayName":"Reporting Bot","AppId":"fc7bd98e-3de5-131a-7a11-4b7d6fd98014","CredentialType":"Secret","KeyId":"cd12f36e-a760-3fd5-8479-bfa3b32bbc5f","EndDateTime":"2025-06-25T07:00:00Z","DaysLeft":-481},{"DisplayName":"Payroll Connector","AppId":"0eba7702-5855-8b71-a7ca-f5273b9559a8","CredentialType":"Secret","KeyId":"8c1444ea-e694-3b03-776c-7d775f4e54ec","EndDateTime":"2026-09-01T07:00:00Z","DaysLeft":-48},{"DisplayName":"Backup Agent","AppId":"5f5909d7-b99e-d45c-ff0b-495c3d2a490b","CredentialType":"Secret","KeyId":"794a7741-1c54-7e73-97e8-dbfa2c597509","EndDateTime":"2026-04-24T07:00:00Z","DaysLeft":-178},{"DisplayName":"Ticketing Webhook","AppId":"8a4e50bd-5ba6-bf30-e6f8-f21a2e522d54","CredentialType":"Secret","KeyId":"fea1dc0d-bb31-db96-c8b5-de62a8a6953f","EndDateTime":"2025-09-16T07:00:00Z","DaysLeft":-398},{"Displa osoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials"}],"Requires":{"Services":["Graph"],"GraphScopes":["Application.Read.All"],"Licenses":[],"DataSets":["Applications"],"OptionalDataSets":[]},"Tags":["Applications","Credentials"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":9},{"Id":"ARG.APP.005","Title":"Certificates expiring within 30 days","Area":"Applications","AreaDisplayName":"Applications","Category":"Credential hygiene","Severity":"Medium","Status":"Passed","Summary":"No certificate expires within 30 days (41 certificates evaluated).","AffectedCount":0,"EvaluatedCount":41,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.941,"Parameters":{"DaysAhead":30},"Description":"Certificates (\u0060keyCredentials\u0060 with usage **Verify**, used by the app to authenticate) that expire within the next **30** days. A certificate counts as **replaced** when the same app already has another certificate valid beyond that window; the check fails only for certificates without a replacement.","Rationale":"An expired certificate stops app-only integrations (automation, connectors, scripts). Planned renewal avoids outages.","Remediation":{"Steps":"1. Ask the application owner which service uses the certificate.\n2. Issue a new certificate (ideally from Azure Key Vault with automatic renewal), upload it to the app registration and deploy it to the service.\n3. Remove the old certificate once nothing uses it.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Add and manage app credentials in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials"},{"Title":"Enforce secret and certificate standards with application management policies","Url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/tutorial-enforce-secret-standards"}],"Requires":{"Services":["Graph"],"GraphSc udience":"AzureADMyOrg"},{"DisplayName":"Backup Agent 15","AppId":"816ef3cc-544e-6510-9b49-fa6407f5aa52","Created":"2024-04-14T23:05:00Z","SignInAudience":"AzureADMultipleOrgs"},{"DisplayName":"Backup Agent 16","AppId":"6d9d045a-5988-1d11-365f-707fb4a77273","Created":"2023-08-22T10:41:00Z","SignInAudience":"AzureADMyOrg"},{"DisplayName":"Intranet SSO 17","AppId":"b433de09-92c9-3fc1-46cc-34b55a2c50c8","Created":"2026-04-12T01:14:00Z","SignInAudience":"AzureADMyOrg"}],"FindingColumns":["DisplayName","AppId","Created","SignInAudience"],"SkipReason":null,"ErrorMessage":null,"Duration":2.017,"Parameters":{},"Description":"App registrations with no owner. The findings show how many secrets and certificates each app holds: an ownerless app with credentials is the first to review.","Rationale":"Without an owner nobody is accountable for the app\u0027s permissions, credentials and lifecycle, and nobody notices when it is no longer needed.","Remediation":{"Steps":"1. Identify who uses the application (sign-in logs, credentials, API permissions help).\n2. Assign at least one owner (two is better) in App registrations \u003E Owners.\n3. Delete applications that nobody claims after a grace period.","PowerShell":"# Sample only - review before running. Adds an owner to one app registration.\nConnect-MgGraph -Scopes \u0027Application.ReadWrite.All\u0027\nNew-MgApplicationOwnerByRef -ApplicationId \u0027\u003CObjectId\u003E\u0027 -BodyParameter @{ \u0027@odata.id\u0027 = \u0027https://graph.microsoft.com/v1.0/directoryObjects/\u003COwnerObjectId\u003E\u0027 }","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Security best practices for application properties (app ownership)","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/security-best-practices-for-app-registration"},{"Title":"Assign enterprise application owners","Url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-app-owners"}],"Requires":{"Services":["Graph"],"GraphSc imits new secrets to 24 months, but secrets created through the API or before that limit can last much longer. Expired secrets are covered by ARG.APP.003.","Rationale":"Long-lived secrets are rarely rotated and outlive the people and documentation that explain them. Microsoft recommends less than 12 months, or certificates and managed identities instead.","Remediation":{"Steps":"1. Replace the secret with a certificate or a managed identity where possible; otherwise create a secret with a shorter lifetime.\n2. Update the service that uses it, then delete the long-lived secret.\n3. Consider an application management policy that limits secret lifetime for new credentials.","PowerShell":"# Sample only - review before running. Adds a 6-month secret; store the returned value securely.\nConnect-MgGraph -Scopes \u0027Application.ReadWrite.All\u0027\nAdd-MgApplicationPassword -ApplicationId \u0027\u003CObjectId\u003E\u0027 -PasswordCredential @{ DisplayName = \u0027rotated\u0027; EndDateTime = (Get-Date).AddMonths(6) }","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Add and manage app credentials in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials"},{"Title":"Enforce secret and certificate standards with application management policies","Url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/tutorial-enforce-secret-standards"}],"Requires":{"Services":["Graph"],"GraphScopes":["Application.Read.All"],"Licenses":[],"DataSets":["Applications"],"OptionalDataSets":[]},"Tags":["Applications","Credentials"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":5},{"Id":"ARG.APP.007","Title":"Certificates with a lifetime above 180 days","Area":"Applications","AreaDisplayName":"Applications","Category":"Credential hygiene","Severity":"Low","Status":"Failed","Summary":"3 of 41 valid authentication certificates have a lifetime longer than 180 days.","AffectedCount":3,"EvaluatedCount":41,"ExcludedCount":0,"Findings":[{"AppName":"HR Portal","AppId":"c58413d8-b13a-0c60-3379-643b582360ba","CertificateName":"CN=app-3.contoso.com","ValidFrom":"2026-01-24","Expires":"2030-02-11","LifetimeDays":1479,"KeyId":"2d92f8a7-ccaa-3c3e-965c-68bb02bce2e8","ObjectId":"b9cb89f8-3fac-f869-1308-fb29c1b6ff57"},{"AppName":"Marketing Forms","AppId":"4094ef4d-1592-790f-4951-c72debac9c3c","CertificateName":"CN=app-2.contoso.com","ValidFrom":"2026-02-05","Expires":"2028-11-06","LifetimeDays":1005,"KeyId":"e1fcbea1-8863-e2b4-df86-e296140df9a4","ObjectId":"a30531cc-73aa-2f14-a326-f1587a238325"},{"AppName":"Marketing Forms","AppId":"f6c98771-0df6-4079-ee05-002f7b556541","CertificateName":"CN=app-1.contoso.com","ValidFrom":"2026-06-29","Expires":"2027-09-22","LifetimeDays":450,"KeyId":"5fc30394-3025-b4f5-e67d-c42779c11953","ObjectId":"a6b43e93-b345-3ba0-aa42-516fd25068b6"}],"FindingColumns":["AppName","AppId","CertificateName","ValidFrom","Expires","LifetimeDays","KeyId","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":0.807,"Parameters":{"MaxLifetimeDays":180},"Description":"Valid authentication certificates (\u0060keyCredentials\u0060 with usage **Verify**) whose lifetime (\u0060endDateTime\u0060 minus \u0060startDateTime\u0060) exceeds **180** days. Expired certificates are covered by ARG.APP.006.","Rationale":"Microsoft recommends limiting application certificate lifetime to 180 days and automating renewal. Long-lived certificates are rarely rotated and stay valid long after the people who deployed them have moved on.","Remediation":{"Steps":"1. Issue certificates from Azure Key Vault with automatic renewal and a lifetime within the policy (Microsoft recommends 180 days or less).\n2. Upload the new certificate, deploy it to the service, then remove the long-lived one.\n3. Consider an application management policy that limits certificate lifetime (asymmetricKeyLifetime) for new credentials.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/"},"References":[{"Title":"Enforce secret and certificate standards with application management policies","Url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/tutorial-enforce-secret-standards"},{"Title":"Add and manage app credentials in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials"}],"Requires":{"Services":["Graph"],"GraphScopes":["Application.Read.All"],"Licenses":[],"DataSets":["Applications"],"OptionalDataSets":[]},"Tags":["Applications","Credentials"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.LIC.006","Title":"Unused licences per SKU","Area":"Licensing","AreaDisplayName":"Licensing","Category":"Cost","Severity":"Medium","Status":"Failed","Summary":"3 of 9 paid SKUs have more than 10% or more than 5 seats unused (81 unused seats in total).","AffectedCount":3,"EvaluatedCount":9,"ExcludedCount":0,"Findings":[{"Sku":"Microsoft 365 E3","SkuPartNumber":"SPE_E3","Purchased":450,"Assigned":391,"Unused":59,"UnusedPercent":13.1},{"Sku":"Microsoft 365 Business Premium","SkuPartNumber":"SPB","Purchased":120,"Assigned":112,"Unused":8,"UnusedPercent":6.7},{"Sku":"Visio Plan 2","SkuPartNumber":"VISIOCLIENT","Purchased":25,"Assigned":11,"Unused":14,"UnusedPercent":56}],"FindingColumns":["Sku","SkuPartNumber","Purchased","Assigned","Unused","UnusedPercent"],"SkipReason":null,"ErrorMessage":null,"Duration":3.15,"Parameters":{"UnusedPercent":10,"FreeSeatThreshold":10000,"UnusedSeats":5,"IgnoredSkus":["FLOW_FREE","POWER_BI_STANDARD","POWER_BI_STANDARD_FACULTY","POWER_BI_STANDARD_STUDENT","POWER_BI_INDIVIDUAL_USER","TEAMS_EXPLORATORY","Microsoft_Teams_Exploratory_Dept","TEAMS_FREE","TEAMS_COMMERCIAL_TRIAL","MS_TEAMS_IW","POWERAPPS_VIRAL","POWERAPPS_DEV","POWERAPPS_INDIVIDUAL_USER","CCIBOTS_PRIVPREV_VIRAL","Power_Pages_vTrial_for_Makers","DYN365_CUSTOMER_INSIGHTS_VIRAL","Dynamics_365_Customer_Service_Enterprise_viral_trial","Dynamics_365_Field_Service_Enterprise_viral_trial","Dynamics_365_Sales_Premium_Viral_Trial","Dynamics_365_Guides_vTrial","Microsoft_Cloud_for_Sustainability_vTrial","FORMS_PRO","WINDOWS_STORE","RIGHTSMANAGEMENT_ADHOC","STREAM","MCOPSTNC","MICROSOFT_BUSINESS_CENTER","SMB_APPS","DEVELOPERPACK","DEVELOPERPACK_E5"]},"Description":"Compares purchased seats (\u0060prepaidUnits.enabled\u0060) with assigned seats (\u0060consumedUnits\u0060) for every active, user-assignable SKU (\u0060capabilityStatus\u0060 = Enabled, \u0060appliesTo\u0060 = User). A SKU fails when more than **10%** or more than **5** seats are unused. Free, viral and developer SKUs (the IgnoredSkus list), SKUs with **10,000** or more seats (free offers are provisioned with very large quantities) and trial SKUs (\u0060isTrial\u0060 in \u0060/directory/subscriptions\u0060) are ignored.","Rationale":"Unused seats are a recurring cost with no business value. Reviewing them before each renewal is the simplest licence saving.","Remediation":{"Steps":"1. Confirm the unused seats are not reserved for planned hires or a migration.\n2. Reassign the seats, or reduce the subscription quantity (for annual commitments, at the next renewal).\n3. Review the SKUs regularly, for example monthly.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/Adminportal/Home#/licenses"},"References":[{"Title":"Buy or remove licenses for a Microsoft business subscription","Url":"https://learn.microsoft.com/en-us/microsoft-365/commerce/licenses/buy-licenses"},{"Title":"Product names and service plan identifiers for licensing","Url":"https://learn.microsoft.com/en-us/entra/identity/users/licensing-service-plan-reference"}],"Requires":{"Services":["Graph"],"GraphScopes":["LicenseAssignment.Read.All"],"Licenses":[],"DataSets":["SubscribedSkus","Subscriptions"],"OptionalDataSets":[]},"Tags":["Licensing","Cost"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.LIC.005","Title":"Licence assignment errors","Area":"Licensing","AreaDisplayName":"Licensing","Category":"Licence hygiene","Severity":"Medium","Status":"Passed","Summary":"No licence assignment errors (1,391 licensed users evaluated).","AffectedCount":0,"EvaluatedCount":1391,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":2.751,"Parameters":{},"Description":"Users whose \u0060licenseAssignmentStates\u0060 contain an entry in state **Error** (the licence is not assigned) or **ActiveWithError** (assigned, but part of it failed). The error column shows the reason reported by Microsoft Entra ID, for example CountViolation (not enough seats), MutuallyExclusiveViolation or ProhibitedInUsageLocationViolation. Group names are shown when groups could be read.","Rationale":"Assignment errors leave users without the services they are expected to have, and usually go unnoticed when licences are assigned through groups.","Remediation":{"Steps":"1. Open the group (for group-based licensing) or the user in the Microsoft Entra admin center and read the error.\n2. Fix the cause: buy or free seats (CountViolation), remove the conflicting licence (MutuallyExclusiveViolation), add the missing prerequisite licence (DependencyViolation), or set the usage location.\n3. Reprocess the group or user so the assignment is retried.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_IAM/LicensesMenuBlade/~/Products"},"References":[{"Title":"Identify and resolve license assignment problems for a group","Url":"https://learn.microsoft.com/en-us/entra/identity/users/licensing-groups-resolve-problems"},{"Title":"licenseAssignmentState resource type","Url":"https://learn.microsoft.com/en-us/graph/api/resources/licenseassignmentstate"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users","SubscribedSkus"],"OptionalDataSets":["Groups"]},"Tags":["Licensing"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.LIC.007","Title":"Shared mailboxes with a licence","Area":"Licensing","AreaDisplayName":"Licensing","Category":"Cost","Severity":"Low","Status":"Investigate","Summary":"2 of 14 shared mailboxes have a licence with no size, archive or hold that requires it (2 more are justified by size, archive or hold).","AffectedCount":2,"EvaluatedCount":14,"ExcludedCount":0,"Findings":[{"DisplayName":"Info","UserPrincipalName":"info@contoso.onmicrosoft.com","Licences":["Office 365 E1"],"MailboxSizeGB":4.1,"ObjectId":"c5e799ba-d50c-2e48-dd49-a40976967c42"},{"DisplayName":"Reception","UserPrincipalName":"reception@contoso.onmicrosoft.com","Licences":["Microsoft 365 Business Basic"],"MailboxSizeGB":0.7,"ObjectId":"0da757cf-8f67-1a99-a2d0-147ae05c10f8"}],"FindingColumns":["DisplayName","UserPrincipalName","Licences","MailboxSizeGB","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":2.234,"Parameters":{"SizeThresholdGB":50},"Description":"Shared mailboxes (Exchange Online) whose user object has licences assigned. A shared mailbox needs a licence only when it is larger than 50 GB, has an online archive, or is on litigation hold or an in-place hold. Mailboxes that meet one of these conditions (size of **50** GB or more, archive active, \u0060LitigationHoldEnabled\u0060, non-empty \u0060InPlaceHolds\u0060) are not listed; the others are returned for review (Investigate), because organisation-wide retention policies and other needs are not visible to this check.","Rationale":"Shared mailboxes are often licensed when a user mailbox is converted and the licence is never removed: a recurring cost with no benefit.","Remediation":{"Steps":"1. Confirm the mailbox does not need a licence (size, archive, holds, retention or other services such as Intune).\n2. Remove the licence from the user object, or remove it from the licensing group.\n3. If the mailbox needs an archive or a hold, consider Exchange Online Plan 2 or the Exchange Online Archiving add-on instead of a full suite.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/Adminportal/Home#/SharedMailbox"},"References": users to the group and wait for the group assignment to be active.\n3. Remove the direct assignments, starting with the redundant ones listed in AlsoFromGroup.","PowerShell":"# Sample only - review before running. Removes one directly assigned licence after the group assignment is active.\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nSet-MgUserLicense -UserId \u0027\u003CObjectId\u003E\u0027 -AddLicenses @() -RemoveLicenses @(\u0027\u003CSkuId\u003E\u0027)","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_IAM/LicensesMenuBlade/~/Products"},"References":[{"Title":"What is group-based licensing in Microsoft Entra ID?","Url":"https://learn.microsoft.com/en-us/entra/fundamentals/concept-group-based-licensing"},{"Title":"Migrate users from individual licenses to group-based licenses","Url":"https://learn.microsoft.com/en-us/entra/identity/users/licensing-groups-migrate-users"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users","SubscribedSkus","Subscriptions"],"OptionalDataSets":[]},"Tags":["Licensing","Groups"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":12},{"Id":"ARG.LIC.001","Title":"Disabled users that still have licences","Area":"Licensing","AreaDisplayName":"Licensing","Category":"Licence hygiene","Severity":"High","Status":"Failed","Summary":"6 of 87 disabled accounts still have licences assigned (3 shared, room or equipment mailboxes excluded).","AffectedCount":6,"EvaluatedCount":87,"ExcludedCount":0,"Findings":[{"DisplayName":"Luca Kowalski","UserPrincipalName":"luca.kowalski7@contoso.onmicrosoft.com","Licences":["Exchange Online (Plan 1)"],"UserType":"Member","SyncedFromOnPrem":false,"ObjectId":"53a80ad4-2e9b-a2a7-f9a8-30ec30886f02"},{"DisplayName":"Riley Jensen","UserPrincipalName":"riley.jensen15@contoso.onmicrosoft.com","Licences":["Exchange Online (Plan 1)"],"UserType":"Member","SyncedFromOnPrem":true,"ObjectId":"6ffb1f22-98b9-8d8d-a623-d2b8f9bbd165"},{"DisplayName":"Former emplo dWrite.All\u0027\n$skus = (Get-MgUserLicenseDetail -UserId \u0027\u003CObjectId\u003E\u0027).SkuId\nSet-MgUserLicense -UserId \u0027\u003CObjectId\u003E\u0027 -AddLicenses @() -RemoveLicenses $skus","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Manage inactive user accounts in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity/monitoring-health/howto-manage-inactive-user-accounts"},{"Title":"Assign or unassign licenses for users in the Microsoft 365 admin center","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/assign-licenses-to-users"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All","AuditLog.Read.All"],"Licenses":["AAD_PREMIUM"],"DataSets":["Users","SubscribedSkus"],"OptionalDataSets":[]},"Tags":["Lifecycle","Licensing","Cost"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.GRP.007","Title":"Public Microsoft 365 groups","Area":"GroupsTeams","AreaDisplayName":"Groups \u0026 Teams","Category":"Group governance","Severity":"Medium","Status":"Failed","Summary":"11 of 486 Microsoft 365 groups are public (8 are Teams).","AffectedCount":11,"EvaluatedCount":486,"ExcludedCount":0,"Findings":[{"DisplayName":"\u003Cimg src=x onerror=alert(2)\u003E","Mail":"imgsrcxonerroralert2@contoso.onmicrosoft.com","Team":"No","Owners":2,"Created":"2024-05-20","GroupId":"a1719c8a-97cf-e6f2-ab36-f1fe029dcad8"},{"DisplayName":"\u003Cscript\u003Ealert(1)\u003C/script\u003E","Mail":"scriptalert1script@contoso.onmicrosoft.com","Team":"Yes","Owners":2,"Created":"2024-04-28","GroupId":"c86c8144-793a-981f-ed29-30cdb91bd90b"},{"DisplayName":"All Company","Mail":"allcompany@contoso.onmicrosoft.com","Team":"Yes","Owners":2,"Created":"2026-05-18","GroupId":"876b4faf-b29a-1f0a-f3b1-d00beac90267"},{"DisplayName":"Board Prep","Mail":"boardprep@contoso.onmicrosoft.com","Team":"Yes","Owners":2,"Created":"2026-03-12","GroupId":"2aa82b59-40c5-ffc5-7c52-523cb24adb68"},{"DisplayName":"Customer X Delivery","Mai bd3484-e37d-cb7d-1efa-97425f13ce8a"},{"DisplayName":"Team 32 - Support","Team":"No","Owner":"luca.conti19@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2023-01-24","GroupId":"bf22304f-83fe-f105-c993-5ff019464ecb"},{"DisplayName":"Team 33 - Ops","Team":"No","Owner":"alex.jensen9@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2024-04-25","GroupId":"4ef8e63d-22c2-98ea-3dc3-b16d8b5a237e"},{"DisplayName":"Team 34 - Ops","Team":"No","Owner":"riley.muller53@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2026-04-15","GroupId":"4ea343b4-84fa-7a30-b1ec-63e5d9053443"},{"DisplayName":"Team 35 - Planning","Team":"Yes","Owner":"casey.garcia72@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2025-06-07","GroupId":"c55f70c2-2d6a-96c8-1d3d-c4440a1ed3f0"},{"DisplayName":"Team 36 - Support","Team":"Yes","Owner":"jordan.muller32@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2026-07-18","GroupId":"d413794a-ee39-deb4-f54c-6ae0de9abec5"},{"DisplayName":"Team 37 - Planning","Team":"Yes","Owner":"elena.ferri25@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2023-11-15","GroupId":"effb2529-14e6-68e3-579a-fa154c57598f"},{"DisplayName":"Team 38 - Support","Team":"No","Owner":"marco.kowalski16@contoso.onmicrosoft.com","OwnerEnabled":"Yes","Created":"2025-02-17","GroupId":"475555f4-16fc-e12b-cd35-b8e9ae3dffce"}],"FindingColumns":["DisplayName","Team","Owner","OwnerEnabled","Created","GroupId"],"SkipReason":null,"ErrorMessage":null,"Duration":1.744,"Parameters":{},"Description":"Microsoft 365 (Unified) groups, including Teams, with exactly one owner. The Owner column shows who it is and OwnerEnabled whether that account is still enabled; groups whose only owner is disabled are listed first.","Rationale":"A single owner is a single point of failure: when that person leaves or changes role the group becomes ownerless. Microsoft recommends at least two owners.","Remediation":{"Steps":"1. Ask each owner to add a second owner (a colleague or a team lead).\n2. Start with the groups whose only owner is disabled.\n3. Make two owners a requirement of your group request process.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/Adminportal/Home#/groups"},"References":[{"Title":"Add or remove members from Microsoft 365 groups using the admin center","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/create-groups/add-or-remove-members-from-groups"},{"Title":"Manage ownerless Microsoft 365 groups and teams","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/create-groups/ownerless-groups-teams"}],"Requires":{"Services":["Graph"],"GraphScopes":["Group.Read.All"],"Licenses":[],"DataSets":["Groups"],"OptionalDataSets":["Users"]},"Tags":["Groups","Teams","Ownership"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":38},{"Id":"ARG.GRP.003","Title":"Group expiration policy configured","Area":"GroupsTeams","AreaDisplayName":"Groups \u0026 Teams","Category":"Lifecycle","Severity":"Medium","Status":"Failed","Summary":"No Microsoft 365 group expiration policy is configured.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":2.397,"Parameters":{},"Description":"Reads \u0060groupLifecyclePolicies\u0060. Fails when no expiration policy exists or when it applies to no group (\u0060managedGroupTypes\u0060 = None); a policy that applies only to selected groups is Investigate. Groups with recent activity are renewed automatically, so active owners are not disturbed.","Rationale":"Without an expiration policy, Microsoft 365 groups and Teams that are no longer used stay forever with their content, guests and permissions. Expiration asks owners to confirm that the group is still needed.","Remediation":{"Steps":"1. In the Microsoft Entra admin center open Groups \u003E Expiration.\n2. Set a lifetime (for example 365 days), an e-mail address for ownerless groups, and apply it to All groups.\n3. Make sure groups have owners first (ARG.GRP.004), otherwise expiry notices only go to the fallback address.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_IAM/GroupsManagementMenuBlade/~/Lifecycle"},"References":[{"Title":"Microsoft 365 group expiration policy","Url":"https://learn.microsoft.com/en-us/microsoft-365/solutions/microsoft-365-groups-expiration-policy"},{"Title":"Configure the expiration policy for Microsoft 365 groups","Url":"https://learn.microsoft.com/en-us/entra/identity/users/groups-lifecycle"}],"Requires":{"Services":["Graph"],"GraphScopes":["Directory.Read.All"],"Licenses":[],"DataSets":["GroupLifecyclePolicies"],"OptionalDataSets":[]},"Tags":["Groups","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.GRP.001","Title":"Microsoft 365 group creation is restricted","Area":"GroupsTeams","AreaDisplayName":"Groups \u0026 Teams","Category":"Group governance","Severity":"Medium","Status":"Investigate","Summary":"All users can create Microsoft 365 groups and Teams (the Group.Unified setting is not configured, so the default applies). Confirm this is intended and that ownership and expiration are governed.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":1.611,"Parameters":{},"Description":"Reads \u0060EnableGroupCreation\u0060 and \u0060GroupCreationAllowedGroupId\u0060 in the tenant-wide Group.Unified directory setting. When the setting was never created every user can create Microsoft 365 groups and Teams (default). Unrestricted creation is Investigate: it is a valid choice for some organisations, provided ownership and expiration are governed.","Rationale":"Every new Team or Planner plan creates a Microsoft 365 group with a mailbox and a SharePoint site. Without a creation policy, sprawl and duplicates grow quickly; restricting creation to trained users or adding a request process keeps it governed.","Remediation":{"Steps":"1. Decide whether creation is open, restricted to a security group, or done through a request process.\n2. To restrict it, create a security group of allowed creators and set EnableGroupCreation = false and GroupCreationAllowedGroupId in the Group.Unified setting.\n3. If creation stays open, make sure ARG.GRP.004 (owners) and ARG.GRP.003 (expiration) pass.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_IAM/GroupsManagementMenuBlade/~/General"},"References":[{"Title":"Manage who can create Microsoft 365 Groups","Url":"https://learn.microsoft.com/en-us/microsoft-365/solutions/manage-creation-of-groups"},{"Title":"Configure group settings using PowerShell","Url":"https://learn.microsoft.com/en-us/entra/identity/users/groups-settings-cmdlets"}],"Requires":{"Services":["Graph"],"GraphScopes":["GroupSettings.Read.All"],"Licenses":[],"DataSets":["GroupSettings"],"OptionalDataSets":[]},"Tags":["Groups","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.GRP.002","Title":"Group naming policy configured","Area":"GroupsTeams","AreaDisplayName":"Groups \u0026 Teams","Category":"Group governance","Severity":"Low","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Entra ID P1 licence (AAD_PREMIUM) not detected.","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"Reads \u0060PrefixSuffixNamingRequirement\u0060 and \u0060CustomBlockedWordsList\u0060 in the tenant-wide Group.Unified directory setting. Passes when a prefix/suffix rule or a blocked-words list is configured. The naming policy requires Microsoft Entra ID P1 for the users it applies to.","Rationale":"A naming convention (for example a GRP- prefix or a department attribute) makes groups and Teams easy to recognise in the address book, in Teams and in SharePoint; blocked words prevent misleading names.","Remediation":{"Steps":"1. Agree on a naming convention (fixed prefix or suffix, or one based on user attributes such as department).\n2. Configure it in the Microsoft Entra admin center: Groups \u003E Naming policy.\n3. Optionally add a list of blocked words.","PowerShell":"","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_IAM/GroupsManagementMenuBlade/~/NamingPolicy"},"References":[{"Title":"Microsoft 365 groups naming policy","Url":"https://learn.microsoft.com/en-us/microsoft-365/solutions/groups-naming-policy"},{"Title":"Enforce a group naming policy in Microsoft Entra ID","Url":"https://learn.microsoft.com/en-us/entra/identity/users/groups-naming-policy"}],"Requires":{"Services":["Graph"],"GraphScopes":["GroupSettings.Read.All"],"Licenses":["AAD_PREMIUM"],"DataSets":["GroupSettings"],"OptionalDataSets":[]},"Tags":["Groups","Policy"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.GRP.008","Title":"Inactive Teams (more than 180 days)","Area":"GroupsTeams","AreaDisplayName":"Groups \u0026 Teams","Category":"Lifecycle","Severity":"Low","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so inactive Teams cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":0.653,"Parameters":{"InactiveDays":180},"Description":"Teams whose \u0060Last Activity Date\u0060 in the Teams team activity report (\u0060getTeamsTeamActivityDetail\u0060, period D180) is older than **180** days, or empty (no activity recorded in the report period). Teams created less than 180 days ago and teams that no longer exist are ignored when groups can be read. With concealed report names, or when the report returns no rows, the result is Investigate.","Rationale":"Inactive Teams keep content, guests and permissions that nobody cur
