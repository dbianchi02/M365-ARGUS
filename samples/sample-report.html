d for more than 30 days","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Licence governance","Severity":"Medium","Status":"Investigate","Summary":"Usage reports return concealed names (admin/reportSettings.displayConcealedNames = true), so Copilot users cannot be identified. Turn the setting off in the Microsoft 365 admin center (Settings \u003E Org settings \u003E Reports) to evaluate this check.","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":null,"ErrorMessage":null,"Duration":0.844,"Parameters":{"InactiveDays":30},"Description":"Users from the Microsoft 365 Copilot usage report (\u0060copilot/reports/getMicrosoft365CopilotUsageUserDetail\u0060, period D180), which lists only users with a Microsoft 365 Copilot licence, whose \u0060Last Activity Date\u0060 is older than 30 days or empty (no Copilot use in the last 180 days). With concealed report names, or when the report returns no rows, the result is To review. Skipped when no Microsoft 365 Copilot licence is detected.","Rationale":"Copilot licences are among the most expensive seats in Microsoft 365. Seats that are not used should go to people on the waiting list, or the user needs adoption support; either way the licence decision should be revisited.","Remediation":{"Steps":"1. Ask the users or their managers whether Copilot is still needed; offer training where adoption is the issue.\n2. Remove the licence (or the user from the licensing group) where it is not needed and reassign it.\n3. Review the Copilot usage report monthly to keep seats with active users.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/#/reportsUsage/MicrosoftCopilot"},"References":[{"Title":"Microsoft 365 reports - Microsoft 365 Copilot usage","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/activity-reports/microsoft-365-copilot-usage"},{"Title":"getMicrosoft365CopilotUsageUserDetail","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/api/admin-settings/reports/copilotreportroot-getmicrosoft365copilotusageuserdetail"}],"Requires":{"Services":["Graph"],"GraphScopes":["Reports.Read.All"],"Licenses":["M365_COPILOT_APPS"],"DataSets":["CopilotUsage","ReportSettings"],"OptionalDataSets":[]},"Tags":["Copilot","Licensing","Reports"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.COP.011","Title":"Agents from external publishers available to all users","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Agent governance","Severity":"Low","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Agent 365 licence (AGENT_365) not detected.","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"Packages of the agent catalogue (\u0060GET /copilot/admin/catalog/packages\u0060) with \u0060type\u0060 = \u0060external\u0060 (built by partners), not blocked, and \u0060availableTo\u0060 = all users. Each one is To review: external agents process data under the publisher\u0027s own terms. Requires a Microsoft Agent 365 licence; otherwise the check is Skipped.","Rationale":"Data processed by non-Microsoft agents and plugins is not covered by Microsoft agreements. Making them available to everybody should follow a review of the publisher\u0027s data handling, ideally with access limited to the teams that need them.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Agents \u003E All agents and filter by external publishers.\n2. For each agent, review the publisher terms and the data it can reach.\n3. Limit availability to specific users or groups, or block the agent; consider allowing only Microsoft and organisation agents in Agents \u003E Settings \u003E Agent and plugin access.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"Manage agents in the Microsoft 365 admin center","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-copilot-agents-integrated-apps"},{"Title":"List Copilot packages","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/api/admin-settings/package/copilotpackages-list"}],"Requires":{"Services":["Graph"],"GraphScopes":["CopilotPackages.Read.All"],"Licenses":["AGENT_365"],"DataSets":["CopilotPackages"],"OptionalDataSets":[]},"Tags":["Copilot","Agents","Inventory"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.COP.012","Title":"Agent requests pending for more than 7 days","Area":"Copilot","AreaDisplayName":"Copilot \u0026 Agents","Category":"Agent governance","Severity":"Low","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Agent 365 licence (AGENT_365) not detected.","ErrorMessage":null,"Duration":0.0,"Parameters":{"PendingDays":7},"Description":"Packages with an open user request (\u0060GET /copilot/admin/catalog/packages?$filter=requestStatus eq \u0027pending\u0027\u0060: publish, activate, access or update) whose \u0060lastModifiedDateTime\u0060 is older than 7 days. The API exposes the package\u0027s last change, not the request date, so the age is approximate. Requires a Microsoft Agent 365 licence; otherwise the check is Skipped.","Rationale":"An approval process only works when requests are answered. Requests left open push users to workarounds (personal agents, shadow tools) and leave the catalogue out of date.","Remediation":{"Steps":"1. In the Microsoft 365 admin center, go to Agents \u003E Requests.\n2. Approve or reject each request, with a reason.\n3. Optionally add the agent management rule that rejects publish requests older than a set number of days (Agents \u003E Settings \u003E Agent management rules).","PowerShell":"","PortalUrl":"https://admin.microsoft.com/"},"References":[{"Title":"List Copilot packages: filter by request properties","Url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/api/admin-settings/package/copilotpackages-list"},{"Title":"Agent settings: agent management rules","Url":"https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-settings"}],"Requires":{"Services":["Graph"],"GraphScopes":["CopilotPackages.Read.All"],"Licenses":["AGENT_365"],"DataSets":["CopilotPackages"],"OptionalDataSets":[]},"Tags":["Copilot","Agents","Lifecycle"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.ENT.002","Title":"Licensed users without manager or department","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"Identity lifecycle","Severity":"Low","Status":"Failed","Summary":"14 of 1,158 licensed users have no manager or no department.","AffectedCount":14,"EvaluatedCount":1158,"ExcludedCount":0,"Findings":[{"DisplayName":"Marco Conti","UserPrincipalName":"marco.conti31@contoso.onmicrosoft.com","Missing":"Department","Manager":"Sam Dubois","Department":"","ObjectId":"41353070-2023-c095-53d6-7d5160c0b170"},{"DisplayName":"Quinn Ferri","UserPrincipalName":"quinn.ferri42@contoso.onmicrosoft.com","Missing":"Manager, Department","Manager":"","Department":"","ObjectId":"b2df00cc-e24a-2861-1178-3440ea19555f"},{"DisplayName":"Avery Kowalski","UserPrincipalName":"avery.kowalski8@contoso.onmicrosoft.com","Missing":"Manager","Manager":"","Department":"Sales","ObjectId":"7a21cbac-41d4-31b5-a1af-60de8a54710a"},{"DisplayName":"Alex Smith","UserPrincipalName":"alex.smith81@contoso.onmicrosoft.com","Missing":"Department","Manager":"Taylor Ferri","Department":"","ObjectId":"961f4884-3793-600b-1af1-acc8bb00df64"},{"DisplayName":"Marco Smith","UserPrincipalName":"marco.smith86@contoso.onmicrosoft.com","Missing":"Manager, Department","Manager":"","Department":"","ObjectId":"17628630-b556-a895-4ace-1a948901b347"},{"DisplayName":"Jamie Silva","UserPrincipalName":"jamie.silva9@contoso.onmicrosoft.com","Missing":"Manager","Manager":"","Department":"Finance","ObjectId":"9440267d-316f-99c1-702b-2c9ee1329172"} vice, shared and emergency accounts) are not evaluated; use the global exclusions for licensed accounts that are not people.","Rationale":"Manager and department drive access reviews, approval workflows, dynamic groups, the organisation chart and the people Copilot considers relevant. Missing values usually mean the HR provisioning or the joiner process skipped a step, and they make every later governance step manual.","Remediation":{"Steps":"1. Fix the source: when users are synchronised or provisioned from HR, complete manager and department there.\n2. For cloud-only users, set them in the Microsoft Entra admin center (Users \u003E user \u003E Properties \u003E Job information).\n3. Make both attributes mandatory in the joiner process.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nUpdate-MgUser -UserId \u0027\u003Cuser\u003E\u0027 -Department \u0027\u003Cdepartment\u003E\u0027\nSet-MgUserManagerByRef -UserId \u0027\u003Cuser\u003E\u0027 -BodyParameter @{ \u0027@odata.id\u0027 = \u0027https://graph.microsoft.com/v1.0/users/\u003Cmanager id\u003E\u0027 }","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserManagementMenuBlade/~/AllUsers"},"References":[{"Title":"Add or update a user\u0027s profile information","Url":"https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info"},{"Title":"List manager","Url":"https://learn.microsoft.com/en-us/graph/api/user-list-manager"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users","UserManagers"],"OptionalDataSets":[]},"Tags":["Users","Lifecycle","DataQuality"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":14},{"Id":"ARG.ENT.006","Title":"Guests without a sponsor","Area":"EntraID","AreaDisplayName":"Entra ID","Category":"External identities","Severity":"Medium","Status":"Failed","Summary":"23 of 214 enabled guests have no sponsor.","AffectedCount":23,"Evalu r, better, a group) makes guest lifecycle decisions possible.","Remediation":{"Steps":"1. For each guest, find the team or project that collaborates with them (group memberships, the inviter in the audit log).\n2. Add a sponsor in the Microsoft Entra admin center (Users \u003E guest \u003E Sponsors), preferably a group.\n3. Remove guests that nobody wants to sponsor, and use sponsors as reviewers in guest access reviews.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nNew-MgUserSponsorByRef -UserId \u0027\u003Cguest id\u003E\u0027 -BodyParameter @{ \u0027@odata.id\u0027 = \u0027https://graph.microsoft.com/v1.0/users/\u003Csponsor id\u003E\u0027 }","PortalUrl":"https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserManagementMenuBlade/~/AllUsers"},"References":[{"Title":"Add sponsors to a guest user","Url":"https://learn.microsoft.com/en-us/entra/external-id/b2b-sponsors"},{"Title":"List sponsors","Url":"https://learn.microsoft.com/en-us/graph/api/user-list-sponsors"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All"],"Licenses":[],"DataSets":["Users","GuestSponsors"],"OptionalDataSets":[]},"Tags":["Guests","Ownership"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":23},{"Id":"ARG.LIC.003","Title":"Paid licences assigned to guest users","Area":"Licensing","AreaDisplayName":"Licensing","Category":"Licence hygiene","Severity":"Medium","Status":"Failed","Summary":"3 of 214 guest users have a paid licence.","AffectedCount":3,"EvaluatedCount":214,"ExcludedCount":0,"Findings":[{"DisplayName":"Consultant (fabrikam.example)","UserPrincipalName":"consultant_fabrikam.example#EXT#@contoso.onmicrosoft.com","Licences":["Microsoft 365 E3"],"AccountEnabled":true,"ObjectId":"d3640ee4-19a1-77ca-3a9d-75c24be45750"},{"DisplayName":"Auditor (adatum.example)","UserPrincipalName":"auditor_adatum.example#EXT#@contoso.onmicrosoft.com","Licences":["Microsoft 365 E3","Power BI Pro"],"AccountEnabled":true,"ObjectId":"6c76f0f9-edf5-a600-a3c0-c277340e1a92"},{"DisplayName":"Former vendor (wingtip.example)","UserPrincipalName":"vendor_wingtip.example#EXT#@contoso.onmicrosoft.com","Licences":["Microsoft 365 E3"],"AccountEnabled":false,"ObjectId":"f2514701-beb4-3ae0-a897-06dd98a04b17"}],"FindingColumns":["DisplayName","UserPrincipalName","Licences","AccountEnabled","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":0.536,"Parameters":{"IgnoredSkus":["FLOW_FREE","POWER_BI_STANDARD","POWER_BI_STANDARD_FACULTY","POWER_BI_STANDARD_STUDENT","POWER_BI_INDIVIDUAL_USER","TEAMS_EXPLORATORY","Microsoft_Teams_Exploratory_Dept","TEAMS_FREE","TEAMS_COMMERCIAL_TRIAL","MS_TEAMS_IW","POWERAPPS_VIRAL","POWERAPPS_DEV","POWERAPPS_INDIVIDUAL_USER","CCIBOTS_PRIVPREV_VIRAL","Power_Pages_vTrial_for_Makers","DYN365_CUSTOMER_INSIGHTS_VIRAL","Dynamics_365_Customer_Service_Enterprise_viral_trial","Dynamics_365_Field_Service_Enterprise_viral_trial","Dynamics_365_Sales_Premium_Viral_Trial","Dynamics_365_Guides_vTrial","Microsoft_Cloud_for_Sustainability_vTrial","FORMS_PRO","WINDOWS_STORE","RIGHTSMANAGEMENT_ADHOC","STREAM","MCOPSTNC","MICROSOFT_BUSINESS_CENTER","SMB_APPS","DEVELOPERPACK","DEVELOPERPACK_E5"],"FreeSeatThreshold":10000},"Description":"Guest users (\u0060userType\u0060 = Guest) with at least one paid licence. Free, viral and trial SKUs are ignored (\u0060IgnoredSkus\u0060, trial subscriptions from \u0060/directory/subscriptions\u0060), as in ARG.LIC.006. Guests normally work with the licences of their home organisation or with the B2B allowance; a paid seat on a guest is usually a mistake or a leftover.","Rationale":"Licences assigned to guests cost a full seat, are rarely reviewed and often stay after the collaboration ends. When a guest really needs a licence, it should be a documented decision with a sponsor, not the side effect of a group-based assignment.","Remediation":{"Steps":"1. Check why each guest has the licence (direct assignment or a licensing group that includes guests).\n2. Remove the licence, or exclude guests from the licensing group (for example with a dynamic group rule on userType).\n3. When a guest needs a licence on purpose, record the decision and the sponsor.","PowerShell":"# Sample only - review before running.\nConnect-MgGraph -Scopes \u0027User.ReadWrite.All\u0027\nSet-MgUserLicense -UserId \u0027\u003Cguest id\u003E\u0027 -AddLicenses @() -RemoveLicenses @(\u0027\u003CskuId\u003E\u0027)","PortalUrl":"https://admin.microsoft.com/#/licenses"},"References":[{"Title":"Microsoft Entra External ID B2B licensing","Url":"https://learn.microsoft.com/en-us/entra/external-id/external-identities-pricing"},{"Title":"Assign or remove licenses for user accounts","Url":"https://learn.microsoft.com/en-us/entra/fundamentals/license-users-groups"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All","LicenseAssignment.Read.All"],"Licenses":[],"DataSets":["Users","SubscribedSkus","Subscriptions"],"OptionalDataSets":[]},"Tags":["Licensing","Guests","Cost"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":3},{"Id":"ARG.LIC.004","Title":"Users with overlapping licences","Area":"Licensing","AreaDisplayName":"Licensing","Category":"Licence hygiene","Severity":"Medium","Status":"Failed","Summary":"6 of 87 users with two or more paid SKUs have a licence fully included in another (6 redundant assignments).","AffectedCount":6,"EvaluatedCount":87,"ExcludedCount":0,"Findings":[{"DisplayName":"Giulia Dubois","UserPrincipalName":"giulia.dubois63@contoso.onmicrosoft.com","RedundantLicence":"Office 365 E1","IncludedIn":"Microsoft 365 E3","ObjectId":"0ef7ddce-2fbe-56e0-5342-2c83e3c10493"},{"DisplayName":"Elena Muller","UserPrincipalName":"elena.muller59@contoso.onmicrosoft.com","RedundantLicence":"Office 365 E1","IncludedIn":"Microsoft 365 E3","ObjectId":"e75ec43c-0d22-7503-abe6-598be22d326a"},{"DisplayName":"Alex Larsen","UserPrincipalName":"alex.larsen92@contoso.onmicrosoft.com","RedundantLicence":"Office 365 E1","IncludedIn":"Microsoft 365 E3","ObjectId":"5454e3ff-5ad9-deb5-4683-2b3e4728280a"},{"DisplayName":"Luca Ferri","UserPrincipalName":"luca.ferri6@contoso.onmicrosoft.com","RedundantLicence":"Exchange Online (Plan 1)","IncludedIn":"Microsoft 365 E3","ObjectId":"6cab6b2c-a1e9-b5a1-8e9a-3980a6ab1059"},{"DisplayName":"Alex Smith","UserPrincipalName":"alex.smith57@contoso.onmicrosoft.com","RedundantLicence":"Exchange Online (Plan 1)","IncludedIn":"Microsoft 365 E3","ObjectId":"272e2558-1bbb-b943-0428-eb4af7456294"},{"DisplayName":"Jamie Kowalski","UserPrincipalName":"jamie.kowalski77@contoso.onmicrosoft.com","RedundantLicence":"Exchange Online (Plan 1)","IncludedIn":"Microsoft 365 E3","ObjectId":"ac50ffb9-aa4a-9b97-18ce-9a7502235707"}],"FindingColumns":["DisplayName","UserPrincipalName","RedundantLicence","IncludedIn","ObjectId"],"SkipReason":null,"ErrorMessage":null,"Duration":0.891,"Parameters":{"IgnoredSkus":["FLOW_FREE","POWER_BI_STANDARD","POWER_BI_STANDARD_FACULTY","POWER_BI_STANDARD_STUDENT","POWER_BI_INDIVIDUAL_USER","TEAMS_EXPLORATORY","Microsoft_Teams_Exploratory_Dept","TEAMS_FREE","TEAMS_COMMERCIAL_TRIAL","MS_TEAMS_IW","POWERAPPS_VIRAL","POWERAPPS_DEV","POWERAPPS_INDIVIDUAL_USER","CCIBOTS_PRIVPREV_VIRAL","Power_Pages_vTrial_for_Makers","DYN365_CUSTOMER_INSIGHTS_VIRAL","Dynamics_365_Customer_Service_Enterprise_viral_trial","Dynamics_365_Field_Service_Enterprise_viral_trial","Dynamics_365_Sales_Premium_Viral_Trial","Dynamics_365_Guides_vTrial","Microsoft_Cloud_for_Sustainability_vTrial","FORMS_PRO","WINDOWS_STORE","RIGHTSMANAGEMENT_ADHOC","STREAM","MCOPSTNC","MICROSOFT_BUSINESS_CENTER","SMB_APPS","DEVELOPERPACK","DEVELOPERPACK_E5"],"FreeSeatThreshold":10000},"Description":"Users with two paid SKUs where every service plan of one SKU is also in the other (from \u0060subscribedSkus.servicePlans\u0060), typically a standalone product or an older suite next to the suite that includes it. The contained SKU is redundant. The comparison uses service plan IDs, so it needs no list of SKU names; free, viral and trial SKUs are ignored as in ARG.LIC.006.","Rationale":"Overlapping licences usually come from upgrades where the old SKU was never removed, or from two licensing groups that both include the user. The contained seat is paid twice and blocks a seat that could go to someone else.","Remediation":{"Steps":"1. For each user, confirm that the larger SKU covers what the user needs.\n2. Remove the redundant SKU, or the user from the licensing group that assigns it.\n3. After upgrades, reduce the quantity of the old SKU at renewal.","PowerShell":"","PortalUrl":"https://admin.microsoft.com/#/licenses"},"References":[{"Title":"Product names and service plan identifiers for licensing","Url":"https://learn.microsoft.com/en-us/entra/identity/users/licensing-service-plan-reference"},{"Title":"subscribedSku resource type","Url":"https://learn.microsoft.com/en-us/graph/api/resources/subscribedsku"}],"Requires":{"Services":["Graph"],"GraphScopes":["User.Read.All","LicenseAssignment.Read.All"],"Licenses":[],"DataSets":["Users","SubscribedSkus","Subscriptions"],"OptionalDataSets":[]},"Tags":["Licensing","Cost"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":6},{"Id":"ARG.SPO.007","Title":"Sites without a sensitivity label","Area":"SharePoint","AreaDisplayName":"SharePoint \u0026 OneDrive","Category":"Site governance","Severity":"Low","Status":"Skipped","Summary":"","AffectedCount":0,"EvaluatedCount":null,"ExcludedCount":0,"Findings":[],"FindingColumns":null,"SkipReason":"Not connected to SharePoint Online (PnP.PowerShell).","ErrorMessage":null,"Duration":0.0,"Parameters":{},"Description":"Site collections (PnP.PowerShell \u0060Get-PnPTenantSite\u0060, OneDrive and system sites excluded) without a sensitivity label (\u0060SensitivityLabel\u0060 empty). When no site has a label at all, sensitivity labels are probably not used for sites and groups: the result is To review instead of Failed. Needs \u0060Connect-Argus -Service SharePoint\u0060; otherwise the check is Skipped.","Rationale":"A container label sets the privacy, external sharing and guest access of a site in one place and tells users and Copilot how sensitive its content is. Once labels are in use, unlabelled sites are the ones that escape those controls and the classification.","Remediation":{"Steps":"1. If labels are not used for sites yet, plan container labels with the compliance team (Microsoft Purview \u003E Information protection).\n2. Apply the appropriate label to each listed site (SharePoint admin center \u003E Active sites \u003E site \u003E Settings \u003E Sensitivity), or to its Microsoft 365 group.\n3. Consider a default label and requiring a label when sites and groups are created.","PowerShell":"# Sample only - review before running.\nConnect-PnPOnline -Url \u0027https://\u003Ctenant\u003E-admin.sharepoint.com\u0027 -Interactive -ClientId \u0027\u003Capp id\u003E\u0027\nSet-PnPTenantSite -Identity \u0027\u003Csite url\u003E\u0027 -SensitivityLabel \u0027\u003Clabel id\u003E\u0027","PortalUrl":"https://admin.microsoft.com/sharepoint?page=siteManagement\u0026modern=true"},"References":[{"Title":"Use sensitivity labels to protect content in Microsoft Teams, Microsoft 365 groups, and SharePoint sites","Url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels-teams-groups-sites"},{"Title":"Get-SPOSite: SensitivityLabel","Url":"https://learn.microsoft.com/en-us/powershell/module/microsoft.online.sharepoint.powershell/get-sposite"}],"Requires":{"Services":["Graph","SharePoint"],"GraphScopes":[],"Licenses":[],"DataSets":["SharePointSites"],"OptionalDataSets":[]},"Tags":["SharePoint","Classification","Inventory"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":0},{"Id":"ARG.EXO.007","Title":"Mailboxes with forwarding configured (inventory)","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Mail flow governance","Severity":"Low","Status":"Investigate","Summary":"4 of 1,199 mailboxes forward mail (2 to external addresses); revi  the owner left. Knowing where mail is forwarded, and why, is part of mailbox lifecycle governance; blocking automatic external forwarding is a security control outside the scope of ARGUS.","Remediation":{"Steps":"1. Review each forwarding with the mailbox owner or manager: target, reason, still needed.\n2. Remove forwarding that is no longer needed (Exchange admin center \u003E Mailboxes \u003E mailbox \u003E Mail flow settings \u003E Email forwarding).\n3. For leavers, replace forwarding with a shared mailbox or delegate access for a limited period.","PowerShell":"# Sample only - review before running.\nConnect-ExchangeOnline\nSet-Mailbox -Identity \u0027\u003Cmailbox\u003E\u0027 -ForwardingSmtpAddress $null -ForwardingAddress $null -DeliverToMailboxAndForward $false","PortalUrl":"https://admin.exchange.microsoft.com/#/mailboxes"},"References":[{"Title":"Configure email forwarding for a mailbox","Url":"https://learn.microsoft.com/en-us/exchange/recipients-in-exchange-online/manage-user-mailboxes/configure-email-forwarding"},{"Title":"Get-EXOMailbox","Url":"https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/get-exomailbox"}],"Requires":{"Services":["Graph","Exchange"],"GraphScopes":["Organization.Read.All"],"Licenses":[],"DataSets":["Mailboxes","Organization"],"OptionalDataSets":[]},"Tags":["Exchange","Mailboxes","MailFlow","Inventory"],"UsesBeta":false,"IsCustom":false,"FindingsTotal":4},{"Id":"ARG.EXO.008","Title":"User mailboxes without a mailbox hold (informational)","Area":"Exchange","AreaDisplayName":"Exchange Online","Category":"Retention governance","Severity":"Info","Status":"Investigate","Summary":"21 of 1,158 user mailboxes have a mailbox hold; 1,137 have none. Confirm in Microsoft Purview that a retention policy covers them.","AffectedCount":1137,"EvaluatedCount":1158,"ExcludedCount":0,"Findings":[{"DisplayName":"Morgan Smith","UserPrincipalName":"morgan.smith69@contoso.onmicrosoft.com","PrimarySmtpAddress":"morgan.smith69@contoso.on       var line = lines[i];

  function polar(radius, deg) {

  // Where the score is lost: weighted points not earned per area (evaluated - earned), largest first,
  // drawn as one neutral line. The card fills the rest of the last grid row (see .area-loss in the CSS);
  // the expand button opens a larger chart with a detail table.
  var lossChartCount = 0;   // unique gradient ids (card chart and zoom chart)
  // Colour bands of "Where the score is lost" in weighted points lost (a failed High check = 5 points):
  // above 15 red, above 10 orange, above 5 yellow, 5 or less yellow-green.
  var LOSS_BANDS = [
    { above: 15, color: '--loss-high' },
    { above: 10, color: '--loss-mid' },
    { above: 5, color: '--loss-low' },
    { above: -1, color: '--loss-min' }
  ];

  function scoreLossData() {
    var rows = areaList().map(function (area) {
      var a = areaInfo(area);
      var lost = Math.max(0, (a.EvaluatedWeight || 0) - (a.EarnedWeight || 0));
      return { area: area, info: a, lost: Math.round(lost * 10) / 10 };
    }).filter(function (r) { return r.lost > 0; })
      .sort(function (x, y) { return (y.lost - x.lost) || (AREA_ORDER.indexOf(x.area) - AREA_ORDER.indexOf(y.area)); });
    var total = rows.reduce(function (sum, r) { return sum + r.lost; }, 0);
    var running = 0;
    rows.forEach(function (r) {
      running += r.lost;
      r.share = total ? Math.round(100 * r.lost / total) : 0;
      r.cumulative = total ? Math.round(100 * running / total) : 0;
    });
    return { rows: rows, total: Math.round(total * 10) / 10 };
  }

  // Draws the line once the chart is on screen (immediately without IntersectionObserver or with reduced motion).
  function drawWhenVisible(node) {
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || typeof IntersectionObserver === 'undefined') { node.classList.add('is-drawn'); return; }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { node.classList.add('is-drawn'); observer.disconnect(); }
      });
    }, { threshold: 0.35 });
    observer.observe(node);
  }

  // Line chart of points lost per area. size: { w, h, large }. onSelect(area) runs on click.
  function lossChart(rows, size, onSelect) {
    var w = size.w;
    var h = size.h;
    var pad = size.large ? { l: 44, r: 24, t: 28, b: 40 } : { l: 18, r: 18, t: 24, b: 30 };
    var n = rows.length;
    var max = rows[0].lost;
    var x = function (i) { return n === 1 ? w / 2 : pad.l + i * (w - pad.l - pad.r) / (n - 1); };
    var y = function (v) { return pad.t + (1 - v / max) * (h - pad.t - pad.b); };
    var base = y(0);

    var chart = svg('svg', {
      class: 'loss-svg', viewBox: '0 0 ' + w + ' ' + h, role: 'img',
      'aria-label': 'Weighted points lost by area, largest first: ' + rows.map(function (r) { return areaName(r.area) + ' ' + r.lost; }).join(', ') + '.'
    });

    // Colour follows the weighted points lost (LOSS_BANDS, highest first), with a short blend at each
    // threshold. The vertical gradient runs from the top value down to zero.
    var gradientId = 'loss-gradient-' + (++lossChartCount);
    var offsetOf = function (points) { return Math.max(0, Math.min(1, (y(points) - y(max)) / (base - y(max) || 1))); };
    var blend = 0.01;
    var gradient = svg('linearGradient', { id: gradientId, gradientUnits: 'userSpaceOnUse', x1: 0, x2: 0, y1: y(max).toFixed(1), y2: base.toFixed(1) });
    var addStop = function (offset, color) { gradient.appendChild(svg('stop', { offset: offset.toFixed(4), style: 'stop-color:var(' + color + ')' })); };
    addStop(0, LOSS_BANDS[0].color);
    for (var b = 1; b < LOSS_BANDS.length; b++) {
      var at = offsetOf(LOSS_BANDS[b - 1].above);
      addStop(Math.max(0, at - blend), LOSS_BANDS[b - 1].color);
      addStop(Math.min(1, at + blend), LOSS_BANDS[b].color);
    }
    addStop(1, LOSS_BANDS[LOSS_BANDS.length - 1].color);
    chart.appendChild(svg('defs', null, gradient));
    // Dots take the exact colour of their band (no blend), so a point next to a threshold is never mixed.
    var bandColor = function (lost) {
      for (var k = 0; k < LOSS_BANDS.length; k++) {
        if (lost > LOSS_BANDS[k].above) { return 'var(' + LOSS_BANDS[k].color + ')'; }
      }
      return 'var(' + LOSS_BANDS[LOSS_BANDS.length - 1].color + ')';
    };
    var paint = 'url(#' + gradientId + ')';

    // Recessive grid: baseline, plus half and max lines with values in the large view.
    var ticks = size.large ? [0, max / 2, max] : [0];
    ticks.forEach(function (t) {
      chart.appendChild(svg('line', { class: t === 0 ? 'loss-axis' : 'loss-grid', x1: pad.l, x2: w - pad.r, y1: y(t).toFixed(1), y2: y(t).toFixed(1) }));
      if (size.large) {
        chart.appendChild(svg('text', { class: 'loss-tick', x: pad.l - 10, y: y(t).toFixed(1), 'text-anchor': 'end', 'dominant-baseline': 'central', text: fmtNumber(Math.round(t * 10) / 10) }));
      }
    });

    var points = rows.map(function (r, i) { return x(i).toFixed(1) + ' ' + y(r.lost).toFixed(1); });
    chart.appendChild(svg('path', { class: 'loss-area', style: 'fill:' + paint, d: 'M' + x(0).toFixed(1) + ' ' + base.toFixed(1) + ' L' + points.join(' L') + ' L' + x(n - 1).toFixed(1) + ' ' + base.toFixed(1) + ' Z' }));
    chart.appendChild(svg('path', { class: 'loss-line', style: 'stroke:' + paint, pathLength: 1, d: 'M' + points.join(' L') }));
    var guide = svg('line', { class: 'loss-guide', x1: 0, x2: 0, y1: pad.t - 8, y2: base });
    chart.appendChild(guide);

    var dots = rows.map(function (r, i) {
      var dot = svg('circle', { class: 'loss-dot' + (i === 0 ? ' is-max' : ''), cx: x(i).toFixed(1), cy: y(r.lost).toFixed(1), r: size.large ? 5 : 4, style: 'stroke:' + bandColor(r.lost) + (i === 0 ? ';fill:' + bandColor(r.lost) : '') + ';transition-delay:' + (300 + i * 70) + 'ms' });
      chart.appendChild(dot);
      var anchor = n > 1 && i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle';
      var label = IRIS_AREA[r.area] || areaName(r.area);
      chart.appendChild(svg('text', { class: 'loss-xlabel', x: x(i).toFixed(1), y: h - pad.b + (size.large ? 24 : 20), 'text-anchor': anchor, text: label }));
      return dot;
    });
    // Selective direct label: only the largest loss carries its value.
    chart.appendChild(svg('text', { class: 'loss-maxlabel', x: (x(0) + (n > 1 ? 8 : 0)).toFixed(1), y: (y(rows[0].lost) - 10).toFixed(1), 'text-anchor': n > 1 ? 'start' : 'middle', text: fmtNumber(rows[0].lost) + ' pts' }));

    var tip = el('div', { class: 'loss-tip', role: 'status', 'aria-live': 'polite' });
    var wrap = el('div', { class: 'loss-chart' + (size.large ? ' is-large' : '') }, chart, tip);

    // Hover layer: one hit column per point, wider than the mark.
    var step = n > 1 ? (w - pad.l - pad.r) / (n - 1) : w;
    rows.forEach(function (r, i) {
      var hit = svg('rect', { class: 'loss-hit', x: (x(i) - step / 2).toFixed(1), y: 0, width: step.toFixed(1), height: h });
      hit.addEventListener('mouseenter', function () {
        guide.setAttribute('x1', x(i).toFixed(1));
        guide.setAttribute('x2', x(i).toFixed(1));
        wrap.classList.add('is-hover');
        dots.forEach(function (d, k) { d.classList.toggle('is-active', k === i); });
        while (tip.firstChild) { tip.removeChild(tip.firstChild); }
        tip.appendChild(el('b', { text: areaName(r.area) }));
        tip.appendChild(el('span', { text: fmtNumber(r.lost) + ' points lost · ' + r.share + '% of the loss' }));
        tip.appendChild(el('span', { class: 'muted', text: typeof r.info.Score === 'number' ? 'Area score ' + r.info.Score + '% · Grade ' + r.info.Grade : 'No area score' }));
        tip.style.left = (100 * x(i) / w).toFixed(2) + '%';
        tip.style.top = (100 * y(r.lost) / h).toFixed(2) + '%';
        tip.dataset.edge = i === 0 && n > 1 ? 'start' : i === n - 1 && n > 1 ? 'end' : '';
      });
      hit.addEventListener('mouseleave', function () {
        wrap.classList.remove('is-hover');
        dots.forEach(function (d) { d.classList.remove('is-active'); });
      });
      hit.addEventListener('click', function () { onSelect(r.area); });
      chart.appendChild(hit);
    });
    return wrap;
  }

  function renderScoreLoss(areaCount) {

  // Detailed view: larger chart and a table with every figure (also the accessible view of the chart).

  function matches(r) {
    if (state.filter === 'Other' && !isOther(r)) { return false; }
    if (state.filter === 'Review' && r.Status !== 'Investigate') { return false; }
    if ((state.filter === 'Passed' || state.filter === 'Failed') && r.Status !== state.filter) { return false; }
    if (state.area && r.Area !== state.area) { return false; }
    if (state.search) {
      var hay = [r.Id, r.Title, r.Summary, r.Category, (r.Tags || []).join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(state.search) < 0) { return false; }
    }
    return true;
  }

  function order(a, b) {
    var byId = a.Id < b.Id ? -1 : a.Id > b.Id ? 1 : 0;
    var byStatus = (GROUP_RANK[a.Status] - GROUP_RANK[b.Status]) || (SEV_RANK[a.Severity] - SEV_RANK[b.Severity]);
    var result;
    switch (state.sort) {
      case 'id': result = byId; break;
      case 'title': result = String(a.Title).localeCompare(String(b.Title), 'en', { numeric: true }) || byId; break;
      case 'severity': result = (SEV_RANK[a.Severity] - SEV_RANK[b.Severity]) || (GROUP_RANK[a.Status] - GROUP_RANK[b.Status]) || byId; break;
      default: result = byStatus || byId;
    }
    return result * state.dir;
  }

  function renderRow(r) {
    var host = el('div', { class: 'detail-host' });
    var details = el('details', { class: 'check', id: r.Id },
      el('summary', { class: 'row-grid' },
        icon('chevron', 14, 'chev'),
        el('span', null, badge(r.Status)),
        el('span', { class: 'c-id', text: r.Id }),
        el('span', { class: 'c-title', text: r.Title }),
        el('span', { class: 'c-sev', text: r.Severity }),
        el('span', { class: 'c-affected', text: r.Status === 'Failed' && r.AffectedCount > 0 ? fmtNumber(r.AffectedCount) : '' })),
      host);
    var entry = { details: details, result: r, host: host, rendered: false };
    checkNodes[r.Id] = entry;
    details.addEventListener('toggle', function () {
      if (!details.open) { return; }
      ensureDetail(entry);
      if (quiet) { return; }
      // One check open at a time keeps the place in the list clear.
      Object.keys(checkNodes).forEach(function (id) { if (id !== r.Id && checkNodes[id].details.open) { checkNodes[id].details.open = false; } });
      if (window.history && window.history.replaceState) { window.history.replaceState(null, '', '#' + r.Id); }
    });
    return details;
  }

  function ensureDetail(entry) {
    if (entry.rendered) { return; }
    entry.rendered = true;
    entry.host.appendChild(renderDetail(entry.result));
  }

  // Checks currently visible, in display order (used by previous / next).
  function visibleIds() {
    var ids = [];
    areaList().forEach(function (area) {
      if (groupNodes[area].section.hidden) { return; }
      results.filter(function (r) { return r.Area === area; }).sort(order).forEach(function (r) {
        if (!checkNodes[r.Id].details.hidden) { ids.push(r.Id); }
      });
    });
    return ids;
  }

  function openCheck(id) {
    var entry = checkNodes[id];
    if (!entry) { return; }
    groupNodes[entry.result.Area].group.open = true;
    entry.details.open = true;
    entry.details.scrollIntoView({ block: 'start' });
    entry.details.querySelector('summary').focus({ preventScroll: true });
  }

  function applyFilters() {
    var visible = 0;
    Object.keys(groupNodes).forEach(function (area) {
      var shown = 0;
      results.filter(function (r) { return r.Area === area; }).forEach(function (r) {
        var show = matches(r);
        checkNodes[r.Id].details.hidden = !show;
        if (show) { shown++; }
      });
      groupNodes[area].section.hidden = shown === 0;
      visible += shown;
    });
    document.getElementById('no-match').hidden = visible > 0;
    document.getElementById('checks-count').textContent = visible === results.length ? results.length + ' checks' : visible + ' of ' + results.length;
    controls.tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)); });
    controls.totals.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)); });
    controls.areaCards.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.area === state.area)); });
    controls.areaReset.hidden = !state.area;
    controls.areaReset.textContent = state.area ? areaName(state.area) + ' ×' : '';
    if (controls.search.value.trim().toLowerCase() !== state.search) { controls.search.value = state.search; }
    Object.keys(checkNodes).forEach(function (id) { if (checkNodes[id].rendered) { updateNav(id); } });
  }

  // ---------------------------------------------------------------- detail

  function renderDetail(r) {
    var box = el('div', { class: 'detail ' + kind(r.Status) });
    var evaluated = r.Status === 'Passed' || r.Status === 'Failed' || r.Status === 'Investigate';

    append(box, el('div', { class: 'detail-meta' },
      el('span', { text: STATUS_LABEL[r.Status] || r.Status }),
      el('span', { text: r.Severity + ' severity' }),
      r.Category ? el('span', { text: r.Category }) : null,
      evaluated && r.EvaluatedCount !== null && r.EvaluatedCount !== undefined ? el('span', { text: fmtNumber(r.AffectedCount) + ' of ' + fmtNumber(r.EvaluatedCount) + ' affected' }) : null,
      r.ExcludedCount ? el('span', { text: fmtNumber(r.ExcludedCount) + ' excluded by configuration' }) : null,
      el('span', { class: 'mono', text: r.Id })));

    if (r.SkipReason || r.ErrorMessage) { box.appendChild(el('p', { class: 'reason', text: r.SkipReason || r.ErrorMessage })); }
    if (r.Summary) { box.appendChild(el('p', { class: 'detail-summary', text: r.Summary })); }

    box.appendChild(md(r.Description));
    box.appendChild(el('h3', { text: 'Why it matters' }));
    box.appendChild(md(r.Rationale));

    var findings = Array.isArray(r.Findings) ? r.Findings : [];
    var total = typeof r.FindingsTotal === 'number' ? r.FindingsTotal : findings.length;
    if (findings.length || total) { box.appendChild(renderFindings(r, findings, total)); }

    var rem = r.Remediation || {};
    if (rem.Steps || rem.PortalUrl || rem.PowerShell) {
      box.appendChild(el('h3', { text: 'How to fix' }));
      if (rem.Steps) { box.appendChild(md(rem.Steps)); }
      if (rem.PortalUrl && safeUrl(rem.PortalUrl)) {
        box.appendChild(el('p', null, el('a', { href: rem.PortalUrl, text: 'Open the admin portal', target: '_blank', rel: 'noopener noreferrer' })));
      }
      if (rem.PowerShell) {
        var copy = el('button', { type: 'button', class: 'text-btn copy-btn', text: 'Copy' });
        copy.addEventListener('click', function () { copyText(rem.PowerShell, copy); });
        box.appendChild(el('div', { class: 'code' },
          el('div', { class: 'code-head' }, el('span', { text: 'PowerShell sample. Review before running; ARGUS never runs it.' }), copy),
          el('pre', null, el('code', { text: rem.PowerShell }))));
      }
    }

    var refs = (r.References || []).filter(function (x) { return x && safeUrl(x.Url); });
    if (refs.length) {
      box.appendChild(el('h3', { text: 'References' }));
      box.appendChild(el('ul', { class: 'refs' }, refs.map(function (x) {
        return el('li', null, el('a', { href: x.Url, text: x.Title || x.Url, target: '_blank', rel: 'noopener noreferrer' }));
      })));
    }

    var params = r.Parameters || {};
    var keys = Object.keys(params);
    if (keys.length) {
      box.appendChild(el('p', { class: 'params', text: 'Parameters: ' + keys.map(function (k) { return k + ' = ' + cellText(params[k]); }).join(', ') }));
    }

    // Navigation sits below the check panel, outside its border.
    var nav = el('nav', { class: 'check-nav', 'aria-label': 'Move between checks' });
    checkNodes[r.Id].nav = nav;
    setTimeout(function () { updateNav(r.Id); }, 0);
    var frag = document.createDocumentFragment();
    append(frag, [box, nav]);
    return frag;
  }

  function updateNav(id) {
    var entry = checkNodes[id];
    if (!entry || !entry.nav) { return; }
    var ids = visibleIds();
    var index = ids.indexOf(id);
    var prev = index > 0 ? ids[index - 1] : null;
    var next = index >= 0 && index < ids.length - 1 ? ids[index + 1] : null;
    function navButton(target, cls, dir) {
      var r = target ? checkNodes[target].result : null;
      return el('button', {
        type: 'button', class: 'nav-btn ' + cls, disabled: !target,
        title: r ? r.Id + ' — ' + r.Title : '',
        onclick: function () { if (target) { openCheck(target); } }
      }, dir === 'prev' ? icon('left', 14) : null, el('span', { text: r ? (dir === 'prev' ? 'Previous: ' : 'Next: ') + r.Title : '' }), dir === 'next' ? icon('right', 14) : null);
    }
    while (entry.nav.firstChild) { entry.nav.removeChild(entry.nav.firstChild); }
    append(entry.nav, [
      navButton(prev, 'nav-prev', 'prev'),
      el('span', { class: 'nav-pos', text: index >= 0 ? (index + 1) + ' of ' + ids.length : '' }),
      navButton(next, 'nav-next', 'next')
    ]);
  }

  function renderFindings(r, rows, total) {
    var columns = Array.isArray(r.FindingColumns) && r.FindingColumns.length ? r.FindingColumns.slice() : (rows[0] ? Object.keys(rows[0]) : []);
    var wrap = el('div');
    var tbody = el('tbody');
    var sortState = { column: null, dir: 1 };
    var current = rows.slice();
    var countLabel = el('span', { class: 'muted' });
    var search = el('input', { type: 'search', placeholder: 'Filter', 'aria-label': 'Filter findings of ' + r.Id });
    var exportButton = el('button', { type: 'button', class: 'text-btn', text: 'Export CSV', onclick: function () { downloadCsv(r.Id + '-findings.csv', columns, current); } });

    // Column widths (Excel-like): start from the content, resize by dragging the header edge,
    // double-click the edge to fit, Shift+Left/Right on a focused header for the keyboard.
    var table = el('table', { class: 'resizable' });
    var colgroup = el('colgroup');
    var widths = columns.map(function (c) { return fitWidth(c, rows.slice(0, 300)); });
    var cols = widths.map(function (w) { var col = el('col'); col.style.width = w + 'px'; colgroup.appendChild(col); return col; });
    function applyWidths() {
      widths.forEach(function (w, i) { cols[i].style.width = w + 'px'; });
      table.style.width = widths.reduce(function (sum, w) { return sum + w; }, 0) + 'px';
    }
    function fitWidth(column, sample) {
      var longest = textWidth(column, true);
      sample.forEach(function (row) { longest = Math.max(longest, textWidth(cellText(row[column]), false)); });
      return Math.max(64, Math.min(560, Math.ceil(longest) + 30));
    }

    var headRow = el('tr');
    columns.forEach(function (column, index) {
      var th = el('th', { class: 'sortable', scope: 'col', tabindex: '0', 'aria-sort': 'none', title: column }, el('span', { class: 'th-label', text: column }));
      function sortBy() {
        sortState.dir = sortState.column === column ? -sortState.dir : 1;
        sortState.column = column;
        Array.prototype.forEach.call(headRow.children, function (h) { h.setAttribute('aria-sort', 'none'); });
        th.setAttribute('aria-sort', sortState.dir === 1 ? 'ascending' : 'descending');
        draw();
      }
      th.addEventListener('click', sortBy);
      th.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(); }
        else if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
          e.preventDefault();
          widths[index] = Math.max(48, widths[index] + (e.key === 'ArrowRight' ? 24 : -24));
          applyWidths();
        }
      });

      var handle = el('span', { class: 'col-resizer', 'aria-hidden': 'true', title: 'Drag to resize, double-click to fit' });
      handle.addEventListener('click', function (e) { e.stopPropagation(); });
      handle.addEventListener('dblclick', function (e) {
        e.stopPropagation();
        widths[index] = fitWidth(column, current);
        applyWidths();
      });
      handle.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var startX = e.clientX;
        var startWidth = widths[index];
        // Pointer coordinates are in screen pixels; widths are CSS pixels (the page may be zoomed).
        var scale = table.getBoundingClientRect().width / (table.offsetWidth || 1) || 1;
        handle.setPointerCapture(e.pointerId);
        document.body.classList.add('resizing');
        function move(ev) {
          widths[index] = Math.max(48, Math.round(startWidth + (ev.clientX - startX) / scale));
          applyWidths();
        }
        function up() {
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', up);
          handle.removeEventListener('pointercancel', up);
          document.body.classList.remove('resizing');
        }
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
        handle.addEventListener('pointercancel', up);
      });
      th.appendChild(handle);
      headRow.appendChild(th);
    });

    function draw() {
      var term = search.value.trim().toLowerCase();
      current = rows.filter(function (row) {
        return !term || columns.some(function (c) { return cellText(row[c]).toLowerCase().indexOf(term) >= 0; });
      });
      if (sortState.column) {
        var c = sortState.column;
        current.sort(function (a, b) {
          var x = a[c], y = b[c];
          if (typeof x === 'number' && typeof y === 'number') { return (x - y) * sortState.dir; }
          return cellText(x).localeCompare(cellText(y), 'en', { numeric: true }) * sortState.dir;
        });
      }
      while (tbody.firstChild) { tbody.removeChild(tbody.firstChild); }
      var frag = document.createDocumentFragment();
      current.forEach(function (row) {
        var tr = el('tr');
        columns.forEach(function (c) {
          var value = cellText(row[c]);
          tr.appendChild(el('td', { text: value, title: value.length > 12 ? value : null }));
        });
        frag.appendChild(tr);
      });
      tbody.appendChild(frag);
      countLabel.textContent = current.length === rows.length ? fmtNumber(rows.length) + ' rows' : fmtNumber(current.length) + ' of ' + fmtNumber(rows.length);
    }
    search.addEventListener('input', draw);

    append(table, [colgroup, el('thead', null, headRow), tbody]);
    applyWidths();
    wrap.appendChild(el('div', { class: 'findings-head' }, el('h3', { text: 'Findings' }), countLabel, search, exportButton));
    wrap.appendChild(el('div', { class: 'findings-table' }, table));
    if (total > rows.length) {
      wrap.appendChild(el('p', { class: 'cap-note', text: 'Showing ' + fmtNumber(rows.length) + ' of ' + fmtNumber(total) + '. The full list is in the JSON and CSV outputs.' }));
    }
    draw();
    return wrap;
  }

  // ---------------------------------------------------------------- footer

  function renderFooter() {
    var scopes = {};
    results.forEach(function (r) { ((r.Requires || {}).GraphScopes || []).forEach(function (s) { scopes[s] = true; }); });
    var notEvaluated = results.filter(function (r) { return r.Status === 'Skipped' || r.Status === 'Error' || r.Status === 'NotRun'; });

    var table = notEvaluated.length ? el('table', null,
      el('thead', null, el('tr', null, el('th', { text: 'Check' }), el('th', { text: 'Status' }), el('th', { text: 'Reason' }))),
      el('tbody', null, notEvaluated.map(function (r) {
        return el('tr', null, el('td', null, el('a', { href: '#' + r.Id, class: 'mono', text: r.Id })), el('td', { text: STATUS_LABEL[r.Status] }), el('td', { text: r.SkipReason || r.ErrorMessage || '' }));
      }))) : el('p', { text: 'All selected checks were evaluated.' });

    var filters = run.Filters || {};
    var filterText = ['Area', 'Id', 'ExcludeId', 'Tag'].filter(function (k) { return filters[k] && filters[k].length; })
      .map(function (k) { return '-' + k + ' ' + filters[k].join(', '); }).join('  ');

    function row(label, value) { return [el('dt', { text: label }), el('dd', null, value)]; }

    document.getElementById('footer').appendChild(el('div', { class: 'footer-inner' },
      el('details', null,
        el('summary', { text: 'Run details' }),
        el('h3', { text: 'Not evaluated' }), table,
        el('h3', { text: 'Run' }),
        el('dl', { class: 'kv' },
          row('Tenant ID', el('span', { class: 'mono', text: tenant.Id || '—' })),
          row('Duration', fmtDuration(run.DurationSeconds)),
          row('Sign-in', run.AuthMode || '—'),
          row('Connected', (env.ConnectedServices || []).join(', ') || 'none'),
          row('Graph scopes used', el('span', { class: 'mono', text: Object.keys(scopes).sort().join(', ') || 'none' })),
          row('Filters', filterText || 'none'),
          row('Configuration', run.ConfigFile || 'defaults'),
          row('ARGUS', (tool.Version || '') + ' · results schema ' + (data.SchemaVersion || '')))),
      el('p', { class: 'disclaimer' },
        'ARGUS runs read-only governance checks and never changes the tenant. Remediation steps and PowerShell samples are guidance only. ',
        el('a', { href: tool.ProjectUri, text: 'ARGUS ' + (tool.Version || ''), target: '_blank', rel: 'noopener noreferrer' }))));
  }

  // ---------------------------------------------------------------- deep links + print

  function openFromHash() {
    var id = decodeURIComponent((window.location.hash || '').slice(1));
    var entry = checkNodes[id];
    if (!entry) { return; }
    if (entry.details.hidden) { state.search = ''; state.filter = ''; state.area = ''; applyFilters(); }
    openCheck(id);
  }

  var printState = null;
  window.addEventListener('beforeprint', function () {
    printState = { checks: {}, groups: {} };
    quiet = true;
    Object.keys(checkNodes).forEach(function (id) {
      var entry = checkNodes[id];
      printState.checks[id] = entry.details.open;
      if (!entry.details.hidden) { ensureDetail(entry); entry.details.open = true; }
    });
    Object.keys(groupNodes).forEach(function (a) { printState.groups[a] = groupNodes[a].group.open; groupNodes[a].group.open = true; });
    var footer = document.querySelector('.footer details');
    if (footer) { printState.footer = footer.open; footer.open = true; }
  });
  window.addEventListener('afterprint', function () {
    if (!printState) { return; }
    Object.keys(checkNodes).forEach(function (id) { checkNodes[id].details.open = printState.checks[id]; });
    Object.keys(groupNodes).forEach(function (a) { groupNodes[a].group.open = printState.groups[a]; });
    var footer = document.querySelector('.footer details');
    if (footer) { footer.open = printState.footer; }
    setTimeout(function () { quiet = false; }, 0);
    printState = null;
  });

  // ---------------------------------------------------------------- boot

  applyTheme(currentTheme());
  renderHeader();
  renderNotes();
  renderOverview();
  renderAreas();
  renderToolbar();
  renderGroups();
  renderFooter();
  sortRows();
  applyFilters();
  openFromHash();
  window.addEventListener('hashchange', openFromHash);
}());

</script>
</body>
</html>
